<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:var(--g-blue);color:#fff">INSTALL</span>
    <h2 class="slide-title">インストール後は「新しいスレッド」で使う</h2>
    <div class="hitokoto" style="border-color:var(--blue)">
      <span class="badge" style="background:var(--blue)">一言で</span>
      <p>探す、追加する、必要なら認証する、そして新しいスレッドで頼む</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg viewBox="0 0 600 360" width="100%" height="100%" role="img" aria-label="Install flow">
        <defs>
          <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5e6a8a"/></marker>
        </defs>
        <rect x="55" y="54" width="140" height="72" rx="14" fill="#fff" stroke="#1a96c0" stroke-width="2"/>
        <text x="125" y="84" text-anchor="middle" font-size="15" font-weight="900" fill="#1a96c0">1. 探す</text>
        <text x="125" y="106" text-anchor="middle" font-size="12" fill="#5e6a8a">Pluginsを開く</text>
        <line x1="195" y1="90" x2="238" y2="90" stroke="#5e6a8a" stroke-width="2" marker-end="url(#arrow4)"/>
        <rect x="246" y="54" width="140" height="72" rx="14" fill="#fff" stroke="#1a96c0" stroke-width="2"/>
        <text x="316" y="84" text-anchor="middle" font-size="15" font-weight="900" fill="#1a96c0">2. 追加</text>
        <text x="316" y="106" text-anchor="middle" font-size="12" fill="#5e6a8a">Add to Codex</text>
        <line x1="386" y1="90" x2="429" y2="90" stroke="#5e6a8a" stroke-width="2" marker-end="url(#arrow4)"/>
        <rect x="437" y="54" width="140" height="72" rx="14" fill="#fff" stroke="#d96018" stroke-width="2"/>
        <text x="507" y="84" text-anchor="middle" font-size="15" font-weight="900" fill="#d96018">3. 認証</text>
        <text x="507" y="106" text-anchor="middle" font-size="12" fill="#5e6a8a">必要な場合</text>
        <line x1="507" y1="126" x2="507" y2="172" stroke="#5e6a8a" stroke-width="2" marker-end="url(#arrow4)"/>
        <rect x="342" y="180" width="165" height="76" rx="14" fill="#fff" stroke="#008f6a" stroke-width="2"/>
        <text x="424" y="210" text-anchor="middle" font-size="15" font-weight="900" fill="#008f6a">4. 新スレッド</text>
        <text x="424" y="232" text-anchor="middle" font-size="12" fill="#5e6a8a">使って、と頼む</text>
        <line x1="342" y1="218" x2="222" y2="218" stroke="#5e6a8a" stroke-width="2" marker-end="url(#arrow4)"/>
        <rect x="48" y="180" width="174" height="76" rx="14" fill="#eaf7fc" stroke="#1a96c0" stroke-width="2"/>
        <text x="135" y="209" text-anchor="middle" font-size="15" font-weight="900" fill="#1a96c0">@で指定</text>
        <text x="135" y="232" text-anchor="middle" font-size="12" fill="#5e6a8a">または自然に依頼</text>
        <rect x="80" y="292" width="440" height="34" rx="10" fill="#fff7ed" stroke="#d96018"/>
        <text x="300" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#d96018">外部アプリがある場合は、認証と利用条件を確認する</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">頼み方の例</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-blue)">1</span><p>「今日の未読メールを要約して」</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-blue)">2</span><p>「@gmail を使って下書きを作って」</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-blue)">3</span><p>「Driveの資料から要点を抜き出して」</p></div>
      </div>
      <div class="ok-box">
        <div class="box-title">安心ポイント</div>
        <ul class="box-list">
          <li>インストール後もCodexの承認設定は有効</li>
          <li>必要な外部サービスは認証を求められる</li>
        </ul>
      </div>
      <div class="note-box">
        <div class="box-title">つまずきポイント</div>
        <ul class="box-list">
          <li>入れた直後の古いスレッドでは反映されないことがある</li>
          <li>プラグイン名を明示すると意図が伝わりやすい</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
