<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
.title-slide { width:1280px; height:720px; display:flex; overflow:hidden; }
.panel-dark {
  width:38%;
  background:#1a1d2e;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2.2rem 2.4rem;
  position:relative;
}
.panel-dark::before {
  content:'';
  position:absolute;
  inset:60px auto auto -80px;
  width:300px;
  height:300px;
  background:radial-gradient(circle, rgba(42,184,224,.25), transparent 65%);
}
.ep-badge {
  background:var(--g-blue);
  color:#fff;
  font-size:.68rem;
  font-weight:700;
  padding:.18rem .7rem;
  border-radius:99px;
  margin-bottom:.9rem;
}
.main-title {
  color:#fff;
  font-size:2.15rem;
  font-weight:900;
  line-height:1.25;
  margin-bottom:.55rem;
  position:relative;
}
.main-sub { color:rgba(255,255,255,.62); font-size:.84rem; margin-bottom:1.5rem; position:relative; }
.count-badge {
  display:flex;
  gap:.6rem;
  align-items:center;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  padding:.55rem .9rem;
  position:relative;
}
.big-num { color:#2ab8e0; font-size:2.1rem; font-weight:900; line-height:1; }
.count-label { color:rgba(255,255,255,.68); font-size:.75rem; line-height:1.4; text-align:left; }
.panel-light {
  flex:1;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  padding:2.2rem 2.8rem 1.8rem;
}
.point-section {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.source-badge {
  display:inline-block;
  background:rgba(26,150,192,.1);
  color:var(--blue);
  font-size:.68rem;
  font-weight:700;
  padding:.18rem .7rem;
  border-radius:99px;
  margin-bottom:.9rem;
  width:fit-content;
}
.feature-name { font-size:1rem; color:var(--muted); font-weight:700; margin-bottom:.35rem; }
.right-heading { font-size:1.1rem; font-weight:900; color:var(--text); margin-bottom:1rem; }
.point-list { list-style:none; display:flex; flex-direction:column; gap:.65rem; }
.point-list li { display:flex; gap:.6rem; font-size:.88rem; color:var(--text); line-height:1.55; }
.pnum {
  min-width:22px;
  height:22px;
  background:var(--g-blue);
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.72rem;
  font-weight:700;
  flex-shrink:0;
  margin-top:.05rem;
}
.bottom-info { display:flex; flex-direction:column; gap:.3rem; }
.credit { font-size:.68rem; color:var(--muted); opacity:.78; line-height:1.5; }
</style>
</head>
<body>
<div class="title-slide">
  <div class="panel-dark">
    <span class="ep-badge">Codex Plugins</span>
    <div class="main-title">Codex<br>プラグイン<br>入門</div>
    <div class="main-sub">AIを自分の仕事用に拡張する</div>
    <div class="count-badge">
      <span class="big-num">3</span>
      <span class="count-label">parts<br>Skills / Apps / MCP</span>
    </div>
  </div>
  <div class="panel-light">
    <div class="point-section">
      <span class="source-badge">OpenAI Codex Manual 解説</span>
      <div class="feature-name">Codex Plugins</div>
      <div class="right-heading">Today's Points</div>
      <ul class="point-list">
        <li><span class="pnum">1</span>プラグインを「AI用の部品箱」として理解できる</li>
        <li><span class="pnum">2</span>Skills・Apps・MCP servers の役割の違いがわかる</li>
        <li><span class="pnum">3</span>インストール・自作・共有で気をつける点がわかる</li>
      </ul>
    </div>
    <div class="bottom-info">
      <p class="credit">参考: OpenAI Codex Manual「Plugins」「Build plugins」（2026年6月3日確認）</p>
    </div>
  </div>
</div>
</body>
</html>
