<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-green);color:#fff">CONNECTORS</span>
    <h2 class="slide-title">Gmail・Drive・Slackは「外部情報を使う」担当</h2>
    <div class="hitokoto" style="border-color:var(--green)">
      <span class="badge" style="background:var(--green)">一言で</span>
      <p>メール、資料、会話の中にある仕事の文脈をCodexに渡せます</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg viewBox="0 0 600 360" width="100%" height="100%" role="img" aria-label="External plugins workflow">
        <defs><marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5e6a8a"/></marker></defs>
        <rect x="60" y="48" width="132" height="72" rx="14" fill="#fff" stroke="#008f6a" stroke-width="2"/>
        <text x="126" y="81" text-anchor="middle" font-size="16" font-weight="900" fill="#008f6a">Gmail</text>
        <text x="126" y="103" text-anchor="middle" font-size="12" fill="#5e6a8a">未読・下書き</text>
        <rect x="249" y="48" width="132" height="72" rx="14" fill="#fff" stroke="#008f6a" stroke-width="2"/>
        <text x="315" y="81" text-anchor="middle" font-size="16" font-weight="900" fill="#008f6a">Drive</text>
        <text x="315" y="103" text-anchor="middle" font-size="12" fill="#5e6a8a">資料・表・スライド</text>
        <rect x="438" y="48" width="132" height="72" rx="14" fill="#fff" stroke="#008f6a" stroke-width="2"/>
        <text x="504" y="81" text-anchor="middle" font-size="16" font-weight="900" fill="#008f6a">Slack</text>
        <text x="504" y="103" text-anchor="middle" font-size="12" fill="#5e6a8a">チャンネル・返信</text>
        <line x1="126" y1="120" x2="245" y2="180" stroke="#5e6a8a" stroke-width="2" marker-end="url(#a5)"/>
        <line x1="315" y1="120" x2="315" y2="172" stroke="#5e6a8a" stroke-width="2" marker-end="url(#a5)"/>
        <line x1="504" y1="120" x2="371" y2="180" stroke="#5e6a8a" stroke-width="2" marker-end="url(#a5)"/>
        <rect x="210" y="178" width="180" height="72" rx="16" fill="#e6f5ef" stroke="#008f6a" stroke-width="2"/>
        <text x="300" y="209" text-anchor="middle" font-size="17" font-weight="900" fill="#008f6a">Codex</text>
        <text x="300" y="232" text-anchor="middle" font-size="12" fill="#5e6a8a">要約・下書き・整理</text>
        <line x1="300" y1="250" x2="300" y2="292" stroke="#5e6a8a" stroke-width="2" marker-end="url(#a5)"/>
        <rect x="128" y="300" width="344" height="34" rx="10" fill="#fff" stroke="#dde2ec"/>
        <text x="300" y="322" text-anchor="middle" font-size="13" fill="#1a1d2e">「情報を探す」から「次の文案を作る」へ</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="box">
        <div class="box-title">頼み方の例</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-green)">1</span><p>未読メールを要約して優先度順にして</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-green)">2</span><p>Driveの最新資料から発表メモを作って</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-green)">3</span><p>Slackの議論をまとめて返信案を作って</p></div>
      </div>
      <div class="note-box">
        <div class="box-title">確認すること</div>
        <ul class="box-list"><li>どのアカウントで認証しているか</li><li>どの情報をCodexに読ませるか</li></ul>
      </div>
      <div class="ng-box">
        <div class="box-title">避けたい頼み方</div>
        <ul class="box-list"><li>「全部読んで全部返信して」など範囲が広すぎる依頼</li><li>機密データの扱いを確認しない依頼</li></ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
