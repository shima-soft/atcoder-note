<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-purple);color:#fff">BROWSER</span>
    <h2 class="slide-title">Browserは「画面で確かめる」担当</h2>
    <div class="hitokoto" style="border-color:var(--purple)">
      <span class="badge" style="background:var(--purple)">一言で</span>
      <p>Webアプリやローカル画面を開き、操作して、見た目と挙動を確認します</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg viewBox="0 0 600 360" width="100%" height="100%" role="img" aria-label="Browser plugin workflow">
        <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5e6a8a"/></marker></defs>
        <rect x="58" y="50" width="132" height="72" rx="14" fill="#fff" stroke="#7a3bce" stroke-width="2"/>
        <text x="124" y="82" text-anchor="middle" font-size="15" font-weight="900" fill="#7a3bce">開く</text>
        <text x="124" y="104" text-anchor="middle" font-size="12" fill="#5e6a8a">localhost / file</text>
        <line x1="190" y1="86" x2="238" y2="86" stroke="#5e6a8a" stroke-width="2" marker-end="url(#a3)"/>
        <rect x="246" y="50" width="132" height="72" rx="14" fill="#fff" stroke="#7a3bce" stroke-width="2"/>
        <text x="312" y="82" text-anchor="middle" font-size="15" font-weight="900" fill="#7a3bce">操作</text>
        <text x="312" y="104" text-anchor="middle" font-size="12" fill="#5e6a8a">クリック / 入力</text>
        <line x1="378" y1="86" x2="426" y2="86" stroke="#5e6a8a" stroke-width="2" marker-end="url(#a3)"/>
        <rect x="434" y="50" width="132" height="72" rx="14" fill="#fff" stroke="#7a3bce" stroke-width="2"/>
        <text x="500" y="82" text-anchor="middle" font-size="15" font-weight="900" fill="#7a3bce">撮る</text>
        <text x="500" y="104" text-anchor="middle" font-size="12" fill="#5e6a8a">スクリーンショット</text>
        <rect x="72" y="170" width="456" height="88" rx="16" fill="#f0e8ff" stroke="#7a3bce"/>
        <text x="300" y="206" text-anchor="middle" font-size="18" font-weight="900" fill="#7a3bce">「できたつもり」を画面で確認する</text>
        <text x="300" y="233" text-anchor="middle" font-size="13" fill="#5e6a8a">UI崩れ、ボタン動作、フォーム入力、表示差分に強い</text>
        <rect x="92" y="292" width="416" height="34" rx="10" fill="#fff" stroke="#dde2ec"/>
        <text x="300" y="314" text-anchor="middle" font-size="13" fill="#1a1d2e">Web制作・管理画面・ローカルアプリの仕上げ確認に向く</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="box">
        <div class="box-title">この環境での使いどころ</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">1</span><p>作ったHTMLを開いて見た目を確認</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">2</span><p>ボタンやフォームの操作を検証</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">3</span><p>スクリーンショットで成果を共有</p></div>
      </div>
      <div class="ok-box">
        <div class="box-title">向いている依頼</div>
        <ul class="box-list"><li>「localhostを開いて確認して」</li><li>「このページの表示崩れを見て」</li></ul>
      </div>
      <div class="ng-box">
        <div class="box-title">注意</div>
        <ul class="box-list"><li>ブラウザ接続や権限で失敗することがある</li><li>危険な操作は確認が必要</li></ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
