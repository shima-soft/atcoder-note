<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 06 - 選択ガイド</title>
  <link rel="stylesheet" href="common.css">
</head>
<body class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-green);color:#fff">意思決定ガイド</span>
    <h2 class="slide-title">状況に応じた「賢い選択」のフロー</h2>
    <p class="slide-sub">迷ったらこの流れでコマンドを選択する</p>
  </div>
  <div class="slide-body" style="padding: 0;">
    <div class="flowchart-container" style="height: 100%; width: 100%; padding: 2rem;">
      <div class="flow-card" style="border-color: var(--blue);">
        <div style="font-weight: 900; color: var(--blue);">Q: 新しいタスクを開始する</div>
      </div>
      <div style="font-size: 2rem;">⬇</div>
      <div class="flow-card" style="border-color: var(--blue);">
        <div style="font-weight: 900; color: var(--blue);">別のプロジェクト・話題への移行</div>
      </div>
      <div style="font-size: 2rem;">⬇</div>
      <div class="flow-card" style="background: var(--g-green); color: #fff;">
        <div style="font-weight: 900;">/clear</div>
      </div>
      <div style="font-size: 2rem;">⬇</div>
      <div class="flow-card" style="border-color: var(--blue);">
        <div style="font-weight: 900; color: var(--blue);">同じタスク内で、一部をやり直したい</div>
      </div>
      <div style="font-size: 2rem;">⬇</div>
      <div class="flow-card" style="background: var(--g-green); color: #fff;">
        <div style="font-weight: 900;">/rewind</div>
      </div>
      <div style="font-size: 2rem;">⬇</div>
      <div class="flow-card" style="border-color: var(--blue);">
        <div style="font-weight: 900; color: var(--blue);">同じタスクで、履歴が長くなりすぎた</div>
      </div>
      <div style="font-size: 2rem;">⬇</div>
      <div class="flow-card" style="background: var(--g-green); color: #fff;">
        <div style="font-weight: 900;">/compact</div>
      </div>
    </div>
  </div>
</body>
</html>
