<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css"></head>
<body>
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:rgba(0,143,106,.12);color:var(--green)">ACTION</span>
    <h2 class="slide-title">明日からの導入3ステップ</h2>
    <div class="hitokoto" style="border-color:var(--green)">
      <span class="badge" style="background:var(--green)">一言で</span>
      <p>いきなり無人修正ではなく、まずは読むだけの点検から始める</p>
    </div>
  </div>
  <div class="slide-body">
    <div class="card-grid">
      <div class="card">
        <span class="card-num">1</span>
        <div class="card-title">まず手作業で1回試す</div>
        <p class="card-desc">普通のCodexスレッドで「何を確認し、何があれば報告し、何もなければ黙って終わるか」を試します。</p>
      </div>
      <div class="card">
        <span class="card-num">2</span>
        <div class="card-title">read-onlyで定期点検にする</div>
        <p class="card-desc">最初の自動化は読むだけ。週次のリンク切れ、PR滞留、仕様書の更新漏れなどから始めます。</p>
      </div>
      <div class="card">
        <span class="card-num">3</span>
        <div class="card-title">必要になったらWorktreeで修正案</div>
        <p class="card-desc">差分を作る場合はWorktreeを使い、手元の作業と混ぜずにレビューできる状態にします。</p>
      </div>
    </div>
  </div>
</div>
</body></html>
