<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css"></head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:rgba(26,150,192,.12);color:var(--blue)">EXTEND</span>
    <h2 class="slide-title">Hooksとcodex exec / GitHub Action</h2>
    <div class="hitokoto" style="border-color:var(--blue)">
      <span class="badge" style="background:var(--blue)">一言で</span>
      <p>アプリ内の定期実行だけでなく、CLIやCIにもCodexを組み込める</p>
    </div>
  </div>
  <div class="slide-body pattern-cols">
    <div class="diagram-box">
      <svg viewBox="0 0 620 380" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e6a8a"/></marker></defs>
        <rect x="58" y="50" width="160" height="60" rx="14" fill="#eef8fc" stroke="#1a96c0" stroke-width="2"/>
        <text x="138" y="86" text-anchor="middle" font-size="16" font-weight="900" fill="#1a96c0">Hooks</text>
        <line x1="218" y1="80" x2="300" y2="80" stroke="#5e6a8a" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="306" y="50" width="248" height="60" rx="14" fill="#fff" stroke="#dde2ec" stroke-width="2"/>
        <text x="430" y="76" text-anchor="middle" font-size="14" font-weight="900" fill="#1a1d2e">ツール実行前後のチェック</text>
        <text x="430" y="96" text-anchor="middle" font-size="12" fill="#5e6a8a">秘密情報・標準・ログ</text>
        <rect x="58" y="160" width="160" height="60" rx="14" fill="#f0faf6" stroke="#008f6a" stroke-width="2"/>
        <text x="138" y="196" text-anchor="middle" font-size="16" font-weight="900" fill="#008f6a">codex exec</text>
        <line x1="218" y1="190" x2="300" y2="190" stroke="#5e6a8a" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="306" y="160" width="248" height="60" rx="14" fill="#fff" stroke="#dde2ec" stroke-width="2"/>
        <text x="430" y="186" text-anchor="middle" font-size="14" font-weight="900" fill="#1a1d2e">スクリプトから非対話実行</text>
        <text x="430" y="206" text-anchor="middle" font-size="12" fill="#5e6a8a">JSON出力・Schemaにも対応</text>
        <rect x="58" y="270" width="160" height="60" rx="14" fill="#fff8e8" stroke="#a86a00" stroke-width="2"/>
        <text x="138" y="306" text-anchor="middle" font-size="16" font-weight="900" fill="#a86a00">GitHub Action</text>
        <line x1="218" y1="300" x2="300" y2="300" stroke="#5e6a8a" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="306" y="270" width="248" height="60" rx="14" fill="#fff" stroke="#dde2ec" stroke-width="2"/>
        <text x="430" y="296" text-anchor="middle" font-size="14" font-weight="900" fill="#1a1d2e">PRレビューやCI失敗調査</text>
        <text x="430" y="316" text-anchor="middle" font-size="12" fill="#5e6a8a">権限を絞って実行</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="note-box"><div class="box-title">実務の見方</div><ul class="box-list"><li>Hooksは「実行の前後に差し込む守衛」</li><li>codex execは「バッチ処理でCodexを呼ぶ入口」</li><li>GitHub Actionは「CIの中でCodexを動かす公式ルート」</li></ul></div>
      <div class="ok-box"><div class="box-title">使えるシーン</div><ul class="box-list"><li>PR作成時にレビュー観点を自動実行</li><li>ログをCodexに渡して原因候補を要約</li></ul></div>
      <div class="ng-box"><div class="box-title">失敗パターン</div><ul class="box-list"><li>APIキーをジョブ全体の環境変数に置く</li><li>誰でも起動できるCIに広い権限を渡す</li></ul></div>
    </div>
  </div>
</div>
</body></html>
