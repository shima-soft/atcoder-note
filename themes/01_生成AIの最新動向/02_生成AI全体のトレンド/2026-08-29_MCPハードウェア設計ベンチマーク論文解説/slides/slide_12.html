<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<title>限界と次の一手</title>
</head>
<body>
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:rgba(122,59,206,.12);color:var(--purple)">LIMITATIONS</span>
    <h2 class="slide-title">限界と次の一手 — 論文が正直に書いた“宿題”</h2>
    <div class="hitokoto">
      <span class="badge" style="background:var(--purple)">一言で</span>
      <p>強い結果の裏で、まだ試せていないこと・測れていないことが4つある</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg width="620" height="430" viewBox="0 0 620 430" role="img" aria-label="論文の限界4つ">
        <rect x="20" y="18" width="286" height="184" rx="12" fill="#ffffff" stroke="#dde2ec"/>
        <text x="34" y="44" font-size="12" font-weight="900" fill="#1a1d2e">① 履歴の扱いは“0か100か”しか試してない</text>
        <text x="34" y="64" font-size="11" fill="#5e6a8a">今回：run（全部溜める）vs task（全部捨てる）</text>
        <text x="34" y="82" font-size="11" fill="#5e6a8a">の二択だけ</text>
        <rect x="34" y="94" width="258" height="44" rx="8" fill="#f4efff" stroke="#c9b3ec"/>
        <text x="163" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#7a3bce">次：要約して残す・窓をずらす等</text>
        <text x="163" y="130" text-anchor="middle" font-size="11" fill="#7a3bce">“中間”の工夫が未検証</text>
        <text x="34" y="156" font-size="9.5" fill="#c9162e">Llama以外は差が小さいが、長期では差が出るかも</text>
        <text x="34" y="174" font-size="9.5" fill="#c9162e">今回は40問、もっと長い実務では未知数</text>

        <rect x="320" y="18" width="280" height="184" rx="12" fill="#ffffff" stroke="#dde2ec"/>
        <text x="334" y="44" font-size="12" font-weight="900" fill="#1a1d2e">② “余計な手出し”の重さを区別してない</text>
        <text x="334" y="64" font-size="11" fill="#5e6a8a">EVCRは「余計な成功コール数」だけ</text>
        <text x="334" y="82" font-size="11" fill="#5e6a8a">中身の重大さは無視</text>
        <rect x="334" y="94" width="252" height="44" rx="8" fill="#fdecee" stroke="#f0a8b4"/>
        <text x="460" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#c9162e">例：不要なパラメータ追加 ＝ 軽微</text>
        <text x="460" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#c9162e">誤った配線 ＝ 重大だが同じ1カウント</text>
        <text x="334" y="156" font-size="10" fill="#5e6a8a">次：重大度で重み付けした指標が必要</text>
        <text x="334" y="174" font-size="10" fill="#5e6a8a">現場では後者の方が手戻り大</text>

        <rect x="20" y="218" width="286" height="184" rx="12" fill="#ffffff" stroke="#dde2ec"/>
        <text x="34" y="244" font-size="12" font-weight="900" fill="#1a1d2e">③ 速さ（レイテンシ）を測ってない</text>
        <text x="34" y="264" font-size="11" fill="#5e6a8a">ローカル実行時間はモデルサイズで</text>
        <text x="34" y="282" font-size="11" fill="#5e6a8a">大きく変わるはずだが未計測</text>
        <rect x="34" y="294" width="258" height="44" rx="8" fill="#eff1f7" stroke="#dde2ec"/>
        <text x="163" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1d2e">小さいモデルで少し精度を落として</text>
        <text x="163" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1d2e">“速さ”を取る選択も現場では有効</text>
        <text x="34" y="356" font-size="10" fill="#5e6a8a">トレードオフの可視化が次の宿題</text>
        <text x="34" y="374" font-size="10" fill="#5e6a8a">今回は「正確さ」だけを評価</text>

        <rect x="320" y="218" width="280" height="184" rx="12" fill="#f4efff" stroke="#7a3bce" stroke-width="1.6"/>
        <text x="334" y="244" font-size="12" font-weight="900" fill="#7a3bce">④ 本物ではない“再現サーバ”</text>
        <text x="334" y="264" font-size="11" fill="#1a1d2e">データモデルと依存関係は忠実に</text>
        <text x="334" y="282" font-size="11" fill="#1a1d2e">再現したが、本番APIは叩いていない</text>
        <rect x="334" y="294" width="252" height="44" rx="8" fill="#ffffff" stroke="#c9b3ec"/>
        <text x="460" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#7a3bce">本番とのギャップは残る</text>
        <text x="460" y="330" text-anchor="middle" font-size="11" fill="#5e6a8a">コードも機密で非公開（例示のみ）</text>
        <text x="334" y="360" font-size="10" fill="#5e6a8a">再現性はAppendix Bの例で担保</text>
        <text x="334" y="376" font-size="10" fill="#5e6a8a">現場導入時は本番で再検証を</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">正直な限界は信頼できる証拠</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">1</span><p>論文は弱点も隠さず書く — そこが次の一手のヒント</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">2</span><p>今回の結果は“強力な参考値”、本番では再検証を</p></div>
      </div>
      <div class="ok-box">
        <div class="box-title">✅ 読む側が持つべき視点</div>
        <ul class="box-list">
          <li>40問の実験室 → 数百手の実務では履歴設計がもっと重要に</li>
          <li>精度と速度は別軸 — 小さいモデルも検討の価値あり</li>
        </ul>
      </div>
      <div class="note-box">
        <div class="box-title">次の研究で期待されること</div>
        <ul class="box-list">
          <li>要約型メモリ・重み付けEVCR・速度計測つきベンチマーク</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
