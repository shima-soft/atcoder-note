<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<title>情報の通り道を3方向に広げた</title>
</head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-purple);color:#fff">ARCHITECTURE</span>
    <h2 class="slide-title">情報の通り道を3方向に広げた</h2>
    <div class="hitokoto">
      <span class="badge" style="background:var(--purple)">一言で</span>
      <p>長さ・深さ・幅の3方向で情報を流しやすくしたのが Kimi K3 の設計</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg width="620" height="430" viewBox="0 0 620 430" role="img" aria-label="Kimi K3が情報の流れを広げた3つの方向">
        <!--
          カード: x=14, w=592, rx=16
          カード1 y=18  h=124 (18..142)
          カード2 y=154 h=124 (154..278)
          カード3 y=290 h=124 (290..414)
        -->

        <!-- ① 長さ方向 -->
        <rect x="14" y="18" width="592" height="124" rx="16" fill="#ffffff" stroke="#dde2ec"/>
        <text x="34" y="62" font-size="16" font-weight="900" fill="#7a3bce">① 長さ方向 — Hybrid Attention</text>
        <text x="34" y="90" font-size="13" fill="#1a1d2e">KDA 3層 + Gated MLA 1層をくり返す</text>
        <text x="34" y="112" font-size="13" fill="#5e6a8a">長い文脈を安く読み、要所で全体を見渡す</text>
        <!-- 小図: box[i].x = 390 + i*52 (w=44, gap=8) → 390,442,494,546 / 中心 412,464,516,568 -->
        <rect x="390" y="63" width="44" height="34" rx="8" fill="#f4efff" stroke="#7a3bce"/>
        <text x="412" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#7a3bce">KDA</text>
        <rect x="442" y="63" width="44" height="34" rx="8" fill="#f4efff" stroke="#7a3bce"/>
        <text x="464" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#7a3bce">KDA</text>
        <rect x="494" y="63" width="44" height="34" rx="8" fill="#f4efff" stroke="#7a3bce"/>
        <text x="516" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#7a3bce">KDA</text>
        <rect x="546" y="63" width="44" height="34" rx="8" fill="#7a3bce" stroke="#7a3bce"/>
        <text x="568" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">MLA</text>

        <!-- ② 深さ方向 -->
        <rect x="14" y="154" width="592" height="124" rx="16" fill="#ffffff" stroke="#dde2ec"/>
        <text x="34" y="198" font-size="16" font-weight="900" fill="#7a3bce">② 深さ方向 — Attention Residuals</text>
        <text x="34" y="226" font-size="13" fill="#1a1d2e">前のブロックの情報を選んで取り寄せる</text>
        <text x="34" y="248" font-size="13" fill="#5e6a8a">層が深くなっても情報が薄まりにくい</text>
        <!-- 小図: 3段の層 x=410 w=150 h=20 / y=184,214,244 -->
        <path d="M400 254 L390 254 L390 194 L400 194" stroke="#7a3bce" stroke-width="2" fill="none"/>
        <polygon points="402,194 394,190 394,198" fill="#7a3bce"/>
        <rect x="410" y="184" width="150" height="20" rx="6" fill="#f4efff" stroke="#7a3bce"/>
        <text x="485" y="198" text-anchor="middle" font-size="11" fill="#7a3bce">いまのブロック</text>
        <rect x="410" y="214" width="150" height="20" rx="6" fill="#ffffff" stroke="#dde2ec"/>
        <text x="485" y="228" text-anchor="middle" font-size="11" fill="#5e6a8a">1つ前のブロック</text>
        <rect x="410" y="244" width="150" height="20" rx="6" fill="#ffffff" stroke="#dde2ec"/>
        <text x="485" y="258" text-anchor="middle" font-size="11" fill="#5e6a8a">2つ前のブロック</text>

        <!-- ③ 幅方向 -->
        <rect x="14" y="290" width="592" height="124" rx="16" fill="#ffffff" stroke="#dde2ec"/>
        <text x="34" y="334" font-size="16" font-weight="900" fill="#7a3bce">③ 幅方向 — Stable LatentMoE</text>
        <text x="34" y="362" font-size="13" fill="#1a1d2e">896人の専門家から毎回16人だけ呼ぶ</text>
        <text x="34" y="384" font-size="13" fill="#5e6a8a">規模は巨大でも、動く部分はごく一部</text>
        <!-- 小図: 点グリッド cx = 406 + i*12 (i=0..15), cy = 326/340/354 -->
        <g fill="#dde2ec">
          <circle cx="406" cy="326" r="4"/><circle cx="418" cy="326" r="4"/><circle cx="430" cy="326" r="4"/>
          <circle cx="442" cy="326" r="4"/><circle cx="454" cy="326" r="4"/><circle cx="466" cy="326" r="4"/>
          <circle cx="478" cy="326" r="4"/><circle cx="490" cy="326" r="4"/><circle cx="502" cy="326" r="4"/>
          <circle cx="514" cy="326" r="4"/><circle cx="526" cy="326" r="4"/><circle cx="538" cy="326" r="4"/>
          <circle cx="550" cy="326" r="4"/><circle cx="562" cy="326" r="4"/><circle cx="574" cy="326" r="4"/>
          <circle cx="586" cy="326" r="4"/>
          <circle cx="406" cy="340" r="4"/><circle cx="418" cy="340" r="4"/><circle cx="430" cy="340" r="4"/>
          <circle cx="442" cy="340" r="4"/><circle cx="454" cy="340" r="4"/><circle cx="466" cy="340" r="4"/>
          <circle cx="478" cy="340" r="4"/><circle cx="490" cy="340" r="4"/><circle cx="502" cy="340" r="4"/>
          <circle cx="514" cy="340" r="4"/><circle cx="526" cy="340" r="4"/><circle cx="538" cy="340" r="4"/>
          <circle cx="550" cy="340" r="4"/><circle cx="562" cy="340" r="4"/><circle cx="574" cy="340" r="4"/>
          <circle cx="586" cy="340" r="4"/>
          <circle cx="406" cy="354" r="4"/><circle cx="418" cy="354" r="4"/><circle cx="430" cy="354" r="4"/>
          <circle cx="442" cy="354" r="4"/><circle cx="454" cy="354" r="4"/><circle cx="466" cy="354" r="4"/>
          <circle cx="478" cy="354" r="4"/><circle cx="490" cy="354" r="4"/><circle cx="502" cy="354" r="4"/>
          <circle cx="514" cy="354" r="4"/><circle cx="526" cy="354" r="4"/><circle cx="538" cy="354" r="4"/>
          <circle cx="550" cy="354" r="4"/><circle cx="562" cy="354" r="4"/><circle cx="574" cy="354" r="4"/>
          <circle cx="586" cy="354" r="4"/>
        </g>
        <g fill="#7a3bce">
          <circle cx="430" cy="326" r="4"/><circle cx="514" cy="340" r="4"/><circle cx="466" cy="354" r="4"/>
        </g>
        <text x="406" y="384" font-size="10" fill="#5e6a8a">紫＝そのとき動く専門家（概念図）</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">会社に例えると</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">長</span><p>過去のやりとりを要約して覚える担当を増やした</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">深</span><p>前工程の資料を必要な分だけ取り寄せられる</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">幅</span><p>896人の社員から毎回16人だけ招集する</p></div>
      </div>
      <div class="ok-box">
        <div class="box-title">効いていること</div>
        <ul class="box-list">
          <li>同じ計算量で前作の約2.5倍の伸び</li>
          <li>100万トークンでも計算量が破綻しにくい</li>
        </ul>
      </div>
      <div class="ng-box">
        <div class="box-title">誤解しやすい点</div>
        <ul class="box-list">
          <li>2.8兆すべてが毎回動くわけではない</li>
          <li>専門家を増やすだけでは学習が不安定になる</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
