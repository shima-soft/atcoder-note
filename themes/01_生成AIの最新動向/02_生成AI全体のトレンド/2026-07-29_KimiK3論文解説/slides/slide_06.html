<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<title>9人の専門家を1つにまとめる</title>
</head>
<body>
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:var(--g-purple);color:#fff">POST-TRAINING</span>
    <h2 class="slide-title">9人の専門家を1つにまとめる</h2>
    <div class="hitokoto">
      <span class="badge" style="background:var(--purple)">一言で</span>
      <p>分野ごとに鍛えた9つのモデルを、最後に1つのモデルへ教え込んで統合する</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg width="620" height="410" viewBox="0 0 620 410" role="img" aria-label="Kimi K3の学習後半3ステップ">
        <!--
          縦フロー: box x=60 w=500
          Step1 y=24 h=58 / Step2 y=100 h=150 / Step3 y=268 h=58 / 結果 y=340 h=52
          セル: cell[j].x = 196 + j*116 (w=104, gap=12) → 196,312,428 / 中心 248,364,480
          行: row[i].y = 152 + i*30 (h=26)
        -->
        <rect x="60" y="24" width="500" height="58" rx="12" fill="#ffffff" stroke="#dde2ec"/>
        <text x="310" y="48" text-anchor="middle" font-size="15" font-weight="900" fill="#1a1d2e">① お手本で基礎を作る（SFT）</text>
        <text x="310" y="68" text-anchor="middle" font-size="12" fill="#5e6a8a">複雑な作業の進め方を、良質な例から覚えさせる</text>

        <path d="M310 82 L310 96" stroke="#7a3bce" stroke-width="2"/>
        <polygon points="310,100 305,92 315,92" fill="#7a3bce"/>

        <rect x="60" y="100" width="500" height="150" rx="12" fill="#f4efff" stroke="#7a3bce"/>
        <text x="310" y="124" text-anchor="middle" font-size="15" font-weight="900" fill="#1a1d2e">② 分野 × 考える深さ で9人を育てる（強化学習）</text>
        <text x="248" y="142" text-anchor="middle" font-size="11" fill="#5e6a8a">浅く考える</text>
        <text x="364" y="142" text-anchor="middle" font-size="11" fill="#5e6a8a">深く考える</text>
        <text x="480" y="142" text-anchor="middle" font-size="11" fill="#5e6a8a">最大まで考える</text>

        <text x="80" y="169" font-size="11" fill="#1a1d2e">一般タスク</text>
        <rect x="196" y="152" width="104" height="26" rx="7" fill="#c9aef0"/>
        <rect x="312" y="152" width="104" height="26" rx="7" fill="#a578dd"/>
        <rect x="428" y="152" width="104" height="26" rx="7" fill="#7a3bce"/>

        <text x="80" y="199" font-size="11" fill="#1a1d2e">エージェント</text>
        <rect x="196" y="182" width="104" height="26" rx="7" fill="#c9aef0"/>
        <rect x="312" y="182" width="104" height="26" rx="7" fill="#a578dd"/>
        <rect x="428" y="182" width="104" height="26" rx="7" fill="#7a3bce"/>

        <text x="80" y="229" font-size="11" fill="#1a1d2e">コーディング</text>
        <rect x="196" y="212" width="104" height="26" rx="7" fill="#c9aef0"/>
        <rect x="312" y="212" width="104" height="26" rx="7" fill="#a578dd"/>
        <rect x="428" y="212" width="104" height="26" rx="7" fill="#7a3bce"/>

        <path d="M310 250 L310 264" stroke="#7a3bce" stroke-width="2"/>
        <polygon points="310,268 305,260 315,260" fill="#7a3bce"/>

        <rect x="60" y="268" width="500" height="58" rx="12" fill="#ffffff" stroke="#dde2ec"/>
        <text x="310" y="292" text-anchor="middle" font-size="15" font-weight="900" fill="#1a1d2e">③ 9人の先生から1人の生徒へ教え込む（MOPD）</text>
        <text x="310" y="312" text-anchor="middle" font-size="12" fill="#5e6a8a">分野ごとの強みを、1つのモデルに集約する</text>

        <rect x="60" y="340" width="500" height="52" rx="12" fill="#7a3bce"/>
        <text x="310" y="371" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">1つの Kimi K3 で全部こなせる</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">鍛える3つの分野</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">1</span><p>一般: 調べもの・知識・画像を見ながらの判断</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">2</span><p>エージェント: 長時間の調査やアシスタント業務</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">3</span><p>コーディング: ソフト開発・Webサイト制作</p></div>
      </div>
      <div class="ok-box">
        <div class="box-title">長い作業を学ばせる工夫</div>
        <ul class="box-list">
          <li>全員の作業完了を待たず、途中で区切って学習を先に進める</li>
          <li>考えすぎを防ぐため、使える分量に上限を設ける</li>
        </ul>
      </div>
      <div class="ng-box">
        <div class="box-title">利用時に効いてくる点</div>
        <ul class="box-list">
          <li>「考える深さ」は使う側が選べる。深いほど賢いが時間と費用も増える</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
