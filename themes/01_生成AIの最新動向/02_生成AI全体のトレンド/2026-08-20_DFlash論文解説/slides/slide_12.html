<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<title>速くなる理由を式で整理する</title>
</head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-purple);color:#fff">速さの理由</span>
    <h2 class="slide-title">速くなる理由を、式で整理する</h2>
    <div class="hitokoto">
      <span class="badge" style="background:var(--purple)">一言で</span>
      <p>速くするレバーは2つだけ。DFlashはその2つを同時に引いている</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg width="620" height="430" viewBox="0 0 620 430" role="img" aria-label="1語あたりの時間を決める式と2つのレバー">
        <!--
          式カード 28..104 / レバー 134..244 / 結論 256..400
        -->
        <text x="34" y="20" font-size="13" font-weight="900" fill="#5e6a8a">① 速さを決める式（論文の式1）</text>

        <rect x="20" y="28" width="580" height="76" rx="12" fill="#ffffff" stroke="#dde2ec"/>
        <text x="40" y="75" font-size="14" font-weight="900" fill="#1a1d2e">1語あたりの時間</text>
        <text x="164" y="75" font-size="14" font-weight="900" fill="#1a1d2e">＝</text>
        <rect x="240" y="44" width="180" height="48" fill="none"/>
        <text x="330" y="60" text-anchor="middle" font-size="13" fill="#1a1d2e">下書き時間 ＋ チェック時間</text>
        <path d="M240 68 L420 68" stroke="#1a1d2e" stroke-width="1.5"/>
        <text x="330" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3bce">1回で採用できた語数</text>

        <text x="34" y="124" font-size="13" font-weight="900" fill="#5e6a8a">② 速くするレバーは2つしかない</text>

        <rect x="20" y="134" width="280" height="110" rx="12" fill="#f4efff" stroke="#7a3bce"/>
        <circle cx="46" cy="160" r="13" fill="#7a3bce"/>
        <text x="46" y="165" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">1</text>
        <text x="68" y="165" font-size="13" font-weight="900" fill="#1a1d2e">分母を大きく</text>
        <text x="38" y="192" font-size="11" fill="#1a1d2e">1回のやり取りで採用される</text>
        <text x="38" y="210" font-size="11" fill="#1a1d2e">語数を増やす</text>
        <text x="38" y="232" font-size="11" font-weight="700" fill="#7a3bce">＝ 下書きの精度を上げる</text>

        <rect x="320" y="134" width="280" height="110" rx="12" fill="#f4efff" stroke="#7a3bce"/>
        <circle cx="346" cy="160" r="13" fill="#7a3bce"/>
        <text x="346" y="165" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">2</text>
        <text x="368" y="165" font-size="13" font-weight="900" fill="#1a1d2e">分子を小さく</text>
        <text x="338" y="192" font-size="11" fill="#1a1d2e">下書きにかかるGPU処理の</text>
        <text x="338" y="210" font-size="11" fill="#1a1d2e">回数を減らす</text>
        <text x="338" y="232" font-size="11" font-weight="700" fill="#7a3bce">＝ 下書きを速くする</text>

        <rect x="20" y="256" width="580" height="144" rx="14" fill="#ffffff" stroke="#dde2ec"/>
        <text x="310" y="286" text-anchor="middle" font-size="13" font-weight="900" fill="#1a1d2e">EAGLE-3は①を伸ばすと、②が悪化してしまう</text>
        <text x="310" y="312" text-anchor="middle" font-size="12" fill="#5e6a8a">候補を増やすほど、下書きのGPU処理回数も比例して増えるため</text>
        <path d="M60 330 L560 330" stroke="#dde2ec" stroke-width="1"/>
        <text x="310" y="358" text-anchor="middle" font-size="13" font-weight="900" fill="#7a3bce">DFlashは①と②を同時に引ける</text>
        <text x="310" y="384" text-anchor="middle" font-size="12" fill="#5e6a8a">候補を増やしても下書きは1回のまま。しかも精度も上がる</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">たとえるなら</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">1</span><p>1回のやり取りで上司がOKを出す量を増やす</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">2</span><p>新人が下書きを出すまでの時間を短くする</p></div>
      </div>
      <div class="ok-box">
        <div class="box-title">DFlashが効く理由</div>
        <ul class="box-list">
          <li>下書きは何語でもGPU処理1回（②）</li>
          <li>本体AIの情報を注入して精度も上げた（①）</li>
        </ul>
      </div>
      <div class="ng-box">
        <div class="box-title">既存手法が頭打ちだった理由</div>
        <ul class="box-list">
          <li>①を狙うと②が犠牲になり、差し引きで伸びなかった</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
