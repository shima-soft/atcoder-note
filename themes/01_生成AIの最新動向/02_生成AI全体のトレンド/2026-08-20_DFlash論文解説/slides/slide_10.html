<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<title>1回の処理で候補を全部同時に書き出す</title>
</head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-purple);color:#fff">仕組み</span>
    <h2 class="slide-title">1回の処理で、候補を全部同時に書き出す</h2>
    <div class="hitokoto">
      <span class="badge" style="background:var(--purple)">一言で</span>
      <p>DFlashは16語の下書きを1回のGPU処理で並列生成するため、下書き役を厚くしても速度が落ちない</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg width="620" height="430" viewBox="0 0 620 430" role="img" aria-label="EAGLE-3とDFlashの下書き生成速度の比較">
        <text x="34" y="24" font-size="13" font-weight="900" fill="#5e6a8a">EAGLE-3のドラフト（自己回帰型）</text>
        <rect x="20" y="34" width="580" height="110" rx="14" fill="#ffffff" stroke="#dde2ec"/>
        <rect x="44" y="70" width="36" height="36" rx="7" fill="#eff1f7" stroke="#b9c0d4"/>
        <text x="62" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#5e6a8a">1</text>
        <rect x="90" y="70" width="36" height="36" rx="7" fill="#eff1f7" stroke="#b9c0d4"/>
        <text x="108" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#5e6a8a">2</text>
        <rect x="136" y="70" width="36" height="36" rx="7" fill="#eff1f7" stroke="#b9c0d4"/>
        <text x="154" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#5e6a8a">3</text>
        <rect x="182" y="70" width="36" height="36" rx="7" fill="#eff1f7" stroke="#b9c0d4"/>
        <text x="200" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#5e6a8a">4</text>
        <path d="M80 88 L88 88" stroke="#5e6a8a" stroke-width="1.3" fill="none"/>
        <path d="M126 88 L134 88" stroke="#5e6a8a" stroke-width="1.3" fill="none"/>
        <path d="M172 88 L180 88" stroke="#5e6a8a" stroke-width="1.3" fill="none"/>
        <text x="230" y="93" font-size="13" fill="#5e6a8a">… 16語まで1個ずつ</text>
        <rect x="450" y="66" width="130" height="44" rx="10" fill="#fdecee"/>
        <text x="515" y="93" text-anchor="middle" font-size="14" font-weight="900" fill="#c9162e">GPU処理16回</text>

        <text x="34" y="172" font-size="13" font-weight="900" fill="#5e6a8a">DFlashのドラフト（拡散型）</text>
        <rect x="20" y="182" width="580" height="110" rx="14" fill="#ffffff" stroke="#dde2ec"/>
        <rect x="44" y="218" width="36" height="36" rx="7" fill="#008f6a" stroke="#008f6a"/>
        <text x="62" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
        <rect x="90" y="218" width="36" height="36" rx="7" fill="#008f6a" stroke="#008f6a"/>
        <text x="108" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
        <rect x="136" y="218" width="36" height="36" rx="7" fill="#008f6a" stroke="#008f6a"/>
        <text x="154" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
        <rect x="182" y="218" width="36" height="36" rx="7" fill="#008f6a" stroke="#008f6a"/>
        <text x="200" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
        <text x="230" y="241" font-size="13" fill="#5e6a8a">… 16語を同時に</text>
        <rect x="450" y="214" width="130" height="44" rx="10" fill="#eafaf2"/>
        <text x="515" y="241" text-anchor="middle" font-size="14" font-weight="900" fill="#008f6a">GPU処理1回</text>

        <rect x="20" y="316" width="580" height="94" rx="14" fill="#f4efff" stroke="#c9b3ec"/>
        <text x="310" y="348" text-anchor="middle" font-size="13" font-weight="900" fill="#1a1d2e">下書き役を厚く（層を増や）しても、GPU処理は1回のまま</text>
        <text x="310" y="374" text-anchor="middle" font-size="12" fill="#1a1d2e">5層のDFlashは、1層のEAGLE-3より速く、下書きの精度も高い</text>
        <text x="310" y="396" text-anchor="middle" font-size="12" fill="#5e6a8a">論文Figure3の計測より</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">たとえるなら</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">1</span><p>EAGLE-3は16人分の返信を1人が順番に書く</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">2</span><p>DFlashは16人分の返信を、コピー機のように一括で刷る</p></div>
      </div>
      <div class="ok-box">
        <div class="box-title">効いていること</div>
        <ul class="box-list">
          <li>候補数を増やしてもGPU処理は1回。時間はほぼ変わらない</li>
          <li>下書き役を厚くして質を上げても速度が落ちにくい</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
