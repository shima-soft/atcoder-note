<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<title>具体例で見るDFlashの一連の流れ</title>
</head>
<body>
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:var(--g-purple);color:#fff">全体の流れ</span>
    <h2 class="slide-title">具体例で見る、DFlashの一連の流れ</h2>
    <div class="hitokoto">
      <span class="badge" style="background:var(--purple)">一言で</span>
      <p>①〜⑤の5ステップを高速に繰り返しながら、文章が少しずつ伸びていく</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg width="620" height="430" viewBox="0 0 620 430" role="img" aria-label="DFlashの処理サイクル5ステップ">
        <rect x="20" y="30" width="180" height="106" rx="12" fill="#f4efff" stroke="#7a3bce"/>
        <circle cx="46" cy="52" r="12" fill="#7a3bce"/>
        <text x="46" y="57" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">1</text>
        <text x="66" y="57" font-size="12" font-weight="900" fill="#1a1d2e">質問を入力</text>
        <text x="36" y="82" font-size="10" fill="#5e6a8a">例:「会議日程を</text>
        <text x="36" y="98" font-size="10" fill="#5e6a8a">教えて」</text>
        <text x="36" y="118" font-size="10" fill="#5e6a8a">→ 本体AIへ</text>

        <path d="M200 83 L216 83" stroke="#5e6a8a" stroke-width="2" fill="none"/>
        <polygon points="222,83 212,78 212,88" fill="#5e6a8a"/>

        <rect x="220" y="30" width="180" height="106" rx="12" fill="#f4efff" stroke="#7a3bce"/>
        <circle cx="246" cy="52" r="12" fill="#7a3bce"/>
        <text x="246" y="57" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">2</text>
        <text x="266" y="57" font-size="12" font-weight="900" fill="#1a1d2e">1語目を生成</text>
        <text x="236" y="82" font-size="10" fill="#5e6a8a">本体AIが答えの</text>
        <text x="236" y="98" font-size="10" fill="#5e6a8a">最初の1語を作り</text>
        <text x="236" y="118" font-size="10" fill="#5e6a8a">内部メモを記録</text>

        <path d="M400 83 L416 83" stroke="#5e6a8a" stroke-width="2" fill="none"/>
        <polygon points="422,83 412,78 412,88" fill="#5e6a8a"/>

        <rect x="420" y="30" width="180" height="106" rx="12" fill="#f4efff" stroke="#7a3bce"/>
        <circle cx="446" cy="52" r="12" fill="#7a3bce"/>
        <text x="446" y="57" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">3</text>
        <text x="466" y="57" font-size="12" font-weight="900" fill="#1a1d2e">下書き役へ注入</text>
        <text x="436" y="82" font-size="10" fill="#5e6a8a">記録したメモを</text>
        <text x="436" y="98" font-size="10" fill="#5e6a8a">ドラフト役のKVに</text>
        <text x="436" y="118" font-size="10" fill="#5e6a8a">直接書き込む</text>

        <path d="M510 136 L510 200" stroke="#5e6a8a" stroke-width="2" fill="none"/>
        <polygon points="510,206 505,196 515,196" fill="#5e6a8a"/>

        <rect x="420" y="210" width="180" height="106" rx="12" fill="#eafaf2" stroke="#008f6a"/>
        <circle cx="446" cy="232" r="12" fill="#008f6a"/>
        <text x="446" y="237" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">4</text>
        <text x="466" y="237" font-size="12" font-weight="900" fill="#1a1d2e">候補を並列生成</text>
        <text x="436" y="262" font-size="10" fill="#5e6a8a">ドラフト役が続きの</text>
        <text x="436" y="278" font-size="10" fill="#5e6a8a">候補語を1回の</text>
        <text x="436" y="294" font-size="10" fill="#5e6a8a">計算で一斉に生成</text>

        <path d="M420 263 L404 263" stroke="#5e6a8a" stroke-width="2" fill="none"/>
        <polygon points="398,263 408,258 408,268" fill="#5e6a8a"/>

        <rect x="220" y="210" width="180" height="106" rx="12" fill="#eafaf2" stroke="#008f6a"/>
        <circle cx="246" cy="232" r="12" fill="#008f6a"/>
        <text x="246" y="237" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">5</text>
        <text x="266" y="237" font-size="12" font-weight="900" fill="#1a1d2e">一括チェック</text>
        <text x="236" y="262" font-size="10" fill="#5e6a8a">本体AIが候補を</text>
        <text x="236" y="278" font-size="10" fill="#5e6a8a">まとめて検証し</text>
        <text x="236" y="294" font-size="10" fill="#5e6a8a">OK分だけ採用</text>

        <path d="M220 280 L60 280 L60 145" stroke="#7a3bce" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
        <polygon points="60,139 55,149 65,149" fill="#7a3bce"/>
        <text x="140" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#7a3bce">次のサイクルへ（くり返す）</text>

        <rect x="20" y="336" width="580" height="76" rx="14" fill="#f4efff" stroke="#c9b3ec"/>
        <text x="310" y="366" text-anchor="middle" font-size="12" fill="#1a1d2e">この①〜⑤を高速に繰り返しながら、答えの文章が少しずつ伸びていく</text>
        <text x="310" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#7a3bce">最終的に採用される語は、必ず本体AIがチェック済み（ロスレス）</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">たとえるなら</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">1</span><p>上司が最初の1行を書き、その考え方を新人にメモごと渡す</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">2</span><p>新人が続きの候補を一気に書き、上司がまとめて可否を判断</p></div>
      </div>
      <div class="ok-box">
        <div class="box-title">効いていること</div>
        <ul class="box-list">
          <li>①〜⑤が1サイクル。これを繰り返して文章が伸びる</li>
        </ul>
      </div>
      <div class="note-box">
        <div class="box-title">安心できるポイント</div>
        <ul class="box-list">
          <li>採用される語は必ず本体AI検証済み。答えの中身は変わらない</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
