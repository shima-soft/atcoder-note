<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<title>もう一つの選択肢 拡散モデルというジレンマ</title>
</head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-purple);color:#fff">もう一つの選択肢</span>
    <h2 class="slide-title">画像生成AIと同じ「拡散モデル」という発想</h2>
    <div class="hitokoto">
      <span class="badge" style="background:var(--purple)">一言で</span>
      <p>空欄を一度に埋められて速いが、精度が低いという「速さと質のジレンマ」を抱えている</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg width="620" height="430" viewBox="0 0 620 430" role="img" aria-label="自己回帰型と拡散型の比較">
        <!-- 左: 自己回帰型 -->
        <rect x="20" y="20" width="280" height="250" rx="14" fill="#ffffff" stroke="#dde2ec"/>
        <text x="160" y="50" text-anchor="middle" font-size="14" font-weight="900" fill="#5e6a8a">自己回帰型（AR）</text>
        <rect x="50" y="70" width="42" height="42" rx="8" fill="#7a3bce" stroke="#7a3bce"/>
        <text x="71" y="96" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">1</text>
        <rect x="102" y="70" width="42" height="42" rx="8" fill="#7a3bce" stroke="#7a3bce"/>
        <text x="123" y="96" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">2</text>
        <rect x="154" y="70" width="42" height="42" rx="8" fill="#7a3bce" stroke="#7a3bce"/>
        <text x="175" y="96" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">3</text>
        <rect x="206" y="70" width="42" height="42" rx="8" fill="#7a3bce" stroke="#7a3bce"/>
        <text x="227" y="96" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">4</text>
        <path d="M92 91 L100 91" stroke="#5e6a8a" stroke-width="1.5" fill="none"/>
        <path d="M144 91 L152 91" stroke="#5e6a8a" stroke-width="1.5" fill="none"/>
        <path d="M196 91 L204 91" stroke="#5e6a8a" stroke-width="1.5" fill="none"/>
        <text x="160" y="150" text-anchor="middle" font-size="12" fill="#1a1d2e">1文字ずつ、順番に確定</text>
        <text x="160" y="172" text-anchor="middle" font-size="12" fill="#1a1d2e">精度は高いが計算回数が多い</text>
        <rect x="40" y="200" width="240" height="46" rx="10" fill="#f4efff"/>
        <text x="160" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3bce">正確、でも遅い</text>

        <!-- 右: 拡散型 -->
        <rect x="320" y="20" width="280" height="250" rx="14" fill="#ffffff" stroke="#dde2ec"/>
        <text x="460" y="50" text-anchor="middle" font-size="14" font-weight="900" fill="#5e6a8a">拡散型（Diffusion）</text>
        <rect x="350" y="70" width="42" height="42" rx="8" fill="#eff1f7" stroke="#5e6a8a" stroke-dasharray="3 2"/>
        <text x="371" y="96" text-anchor="middle" font-size="14" font-weight="900" fill="#5e6a8a">?</text>
        <rect x="402" y="70" width="42" height="42" rx="8" fill="#eff1f7" stroke="#5e6a8a" stroke-dasharray="3 2"/>
        <text x="423" y="96" text-anchor="middle" font-size="14" font-weight="900" fill="#5e6a8a">?</text>
        <rect x="454" y="70" width="42" height="42" rx="8" fill="#eff1f7" stroke="#5e6a8a" stroke-dasharray="3 2"/>
        <text x="475" y="96" text-anchor="middle" font-size="14" font-weight="900" fill="#5e6a8a">?</text>
        <rect x="506" y="70" width="42" height="42" rx="8" fill="#eff1f7" stroke="#5e6a8a" stroke-dasharray="3 2"/>
        <text x="527" y="96" text-anchor="middle" font-size="14" font-weight="900" fill="#5e6a8a">?</text>
        <text x="460" y="130" text-anchor="middle" font-size="11" fill="#5e6a8a">↓ 1回の計算で全部を仮埋め</text>
        <text x="460" y="150" text-anchor="middle" font-size="12" fill="#1a1d2e">一度に全部を仮埋めできる</text>
        <text x="460" y="172" text-anchor="middle" font-size="12" fill="#1a1d2e">きれいにするには塗り直しが必要</text>
        <rect x="340" y="200" width="240" height="46" rx="10" fill="#fdecee"/>
        <text x="460" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#c9162e">速い、でも粗い</text>

        <rect x="20" y="300" width="580" height="110" rx="14" fill="#f4efff" stroke="#c9b3ec"/>
        <text x="310" y="347" text-anchor="middle" font-size="14" font-weight="900" fill="#1a1d2e">速さと正確さ、両方を手に入れる方法はないのか？</text>
        <text x="310" y="377" text-anchor="middle" font-size="12" fill="#5e6a8a">拡散モデルを「下書き役」に使えれば、速さだけ借りられるのでは</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">たとえるなら</div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">1</span><p>自己回帰型は1行ずつ確認しながら清書する新人</p></div>
        <div class="biz-step"><span class="snum" style="background:var(--g-purple)">2</span><p>拡散型は全体を一気に下書きしてから直す画伯</p></div>
      </div>
      <div class="ok-box">
        <div class="box-title">拡散モデルの強み</div>
        <ul class="box-list">
          <li>空欄を1回の計算でまとめて埋められる</li>
        </ul>
      </div>
      <div class="ng-box">
        <div class="box-title">拡散モデルの弱み</div>
        <ul class="box-list">
          <li>単体では文章の精度が自己回帰型に劣りやすい</li>
          <li>きれいに仕上げる塗り直しが増えると結局遅い</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
