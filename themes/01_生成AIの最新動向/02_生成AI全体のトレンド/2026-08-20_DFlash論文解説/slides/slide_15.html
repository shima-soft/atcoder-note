<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<title>これが仕事にもたらす意味</title>
</head>
<body>
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:var(--g-purple);color:#fff">ビジネス視点</span>
    <h2 class="slide-title">これが、私たちの仕事にもたらす意味</h2>
    <div class="hitokoto">
      <span class="badge" style="background:var(--purple)">一言で</span>
      <p>応答速度・利用コスト・信頼性。営業や事務の現場でAIを使う体験に直結する変化</p>
    </div>
  </div>
  <div class="slide-body">
    <div class="card-grid">
      <div class="card">
        <div class="card-num" style="background:var(--g-purple)">1</div>
        <div class="card-title">待ち時間が減る</div>
        <div class="card-desc">チャットボットやAI秘書の返信が速くなり、商談中や会議中でもテンポよく使える</div>
      </div>
      <div class="card">
        <div class="card-num" style="background:var(--g-purple)">2</div>
        <div class="card-title">利用コストが下がりやすい</div>
        <div class="card-desc">同じ台数のサーバーでより多くの依頼をさばけるため、AI利用料金の値下げにつながりうる</div>
      </div>
      <div class="card">
        <div class="card-num" style="background:var(--g-purple)">3</div>
        <div class="card-title">答えの中身は変わらない</div>
        <div class="card-desc">最終的な答えは必ず本番AIがチェックする仕組みなので、速くなっても品質は落ちない</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
