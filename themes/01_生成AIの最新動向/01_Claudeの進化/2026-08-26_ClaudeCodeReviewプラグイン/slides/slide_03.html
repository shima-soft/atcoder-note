<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
.wide-diagram {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  padding: .5rem;
}
</style>
</head>
<body>
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:var(--g-blue);color:#fff">OVERVIEW</span>
    <h2 class="slide-title">5つの専門エージェントが並行動作する</h2>
    <div class="hitokoto" style="border-color:var(--blue)">
      <span class="badge" style="background:var(--blue)">一言で</span>
      <p>1つのAIではなく、それぞれ得意分野を持った5人が同時にチェックするイメージ</p>
    </div>
  </div>
  <div class="slide-body">
    <div class="wide-diagram">
      <!--
        入力: x=30 w=100 (right=130)
        エージェント: box[i].x = 170 + i * 132  (boxWidth=120, gap=12) → 170,302,434,566,698 / right=818
        出力: x=852 w=120 (right=972)
        viewBox: 0 0 1000 460
      -->
      <svg viewBox="0 0 1000 460" width="1152" height="530" font-family="'Noto Sans JP','Meiryo',sans-serif">
        <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d2e">5つの視点から同時にレビュー</text>

        <!-- 入力（脇役・グレー） -->
        <rect x="30" y="140" width="100" height="80" rx="10" fill="#f7f8fa" stroke="#dde2ec" stroke-width="1"/>
        <text x="80" y="170" text-anchor="middle" font-size="13" fill="#5e6a8a">Pull</text>
        <text x="80" y="190" text-anchor="middle" font-size="13" fill="#5e6a8a">Request</text>

        <!-- 矢印: 入力→各エージェント -->
        <line x1="136" y1="160" x2="164" y2="100" stroke="#9fd4e6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <line x1="136" y1="168" x2="164" y2="148" stroke="#9fd4e6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <line x1="136" y1="180" x2="164" y2="196" stroke="#9fd4e6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <line x1="136" y1="192" x2="164" y2="244" stroke="#9fd4e6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <line x1="136" y1="200" x2="164" y2="292" stroke="#9fd4e6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

        <!-- エージェント1: CLAUDE.md -->
        <rect x="170" y="56" width="120" height="80" rx="10" fill="#ffffff" stroke="#1a96c0" stroke-width="2.5"/>
        <text x="230" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1a96c0">CLAUDE.md</text>
        <text x="230" y="108" text-anchor="middle" font-size="12" fill="#1a1d2e">ルール遵守</text>
        <text x="230" y="124" text-anchor="middle" font-size="11" fill="#5e6a8a">チェック</text>

        <!-- エージェント2: バグ検出 -->
        <rect x="302" y="104" width="120" height="80" rx="10" fill="#ffffff" stroke="#1a96c0" stroke-width="2.5"/>
        <text x="362" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1a96c0">バグ</text>
        <text x="362" y="156" text-anchor="middle" font-size="12" fill="#1a1d2e">検出</text>
        <text x="362" y="172" text-anchor="middle" font-size="11" fill="#5e6a8a">エージェント</text>

        <!-- エージェント3: 履歴分析 -->
        <rect x="434" y="152" width="120" height="80" rx="10" fill="#ffffff" stroke="#1a96c0" stroke-width="2.5"/>
        <text x="494" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1a96c0">Git 履歴</text>
        <text x="494" y="204" text-anchor="middle" font-size="12" fill="#1a1d2e">コンテキスト</text>
        <text x="494" y="220" text-anchor="middle" font-size="11" fill="#5e6a8a">分析</text>

        <!-- エージェント4: 過去PR -->
        <rect x="566" y="200" width="120" height="80" rx="10" fill="#ffffff" stroke="#1a96c0" stroke-width="2.5"/>
        <text x="626" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1a96c0">過去PR</text>
        <text x="626" y="252" text-anchor="middle" font-size="12" fill="#1a1d2e">コメント</text>
        <text x="626" y="268" text-anchor="middle" font-size="11" fill="#5e6a8a">レビュー</text>

        <!-- エージェント5: コードコメント -->
        <rect x="698" y="248" width="120" height="80" rx="10" fill="#ffffff" stroke="#1a96c0" stroke-width="2.5"/>
        <text x="758" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1a96c0">コード内</text>
        <text x="758" y="300" text-anchor="middle" font-size="12" fill="#1a1d2e">コメント</text>
        <text x="758" y="316" text-anchor="middle" font-size="11" fill="#5e6a8a">確認</text>

        <!-- 矢印: 各エージェント→出力 -->
        <line x1="296" y1="96" x2="846" y2="168" stroke="#9fd4e6" stroke-width="1"/>
        <line x1="428" y1="144" x2="846" y2="176" stroke="#9fd4e6" stroke-width="1"/>
        <line x1="560" y1="192" x2="846" y2="184" stroke="#9fd4e6" stroke-width="1"/>
        <line x1="692" y1="240" x2="846" y2="192" stroke="#9fd4e6" stroke-width="1"/>
        <line x1="824" y1="288" x2="852" y2="200" stroke="#9fd4e6" stroke-width="1"/>

        <!-- 出力（主役・青） -->
        <rect x="852" y="140" width="120" height="80" rx="10" fill="rgba(26,150,192,.07)" stroke="#1a96c0" stroke-width="2.5"/>
        <text x="912" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1a96c0">フィルタ</text>
        <text x="912" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1a96c0">リング</text>

        <!-- 出力2: GitHub コメント -->
        <rect x="852" y="260" width="120" height="72" rx="10" fill="rgba(26,150,192,.07)" stroke="#1a96c0" stroke-width="2.5"/>
        <text x="912" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1a96c0">GitHub</text>
        <text x="912" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#1a96c0">コメント</text>

        <line x1="912" y1="224" x2="912" y2="254" stroke="#1a96c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

        <!-- 凡例 -->
        <rect x="30" y="396" width="14" height="14" rx="3" fill="#ffffff" stroke="#1a96c0" stroke-width="2.5"/>
        <text x="50" y="408" font-size="12" fill="#5e6a8a">専門エージェント（5つ並行）</text>
        <rect x="280" y="396" width="14" height="14" rx="3" fill="rgba(26,150,192,.07)" stroke="#1a96c0" stroke-width="2.5"/>
        <text x="300" y="408" font-size="12" fill="#5e6a8a">フィルタリング結果</text>
        <rect x="500" y="396" width="14" height="14" rx="3" fill="#f7f8fa" stroke="#dde2ec" stroke-width="1"/>
        <text x="520" y="408" font-size="12" fill="#5e6a8a">入力（PR）</text>

        <defs>
          <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0,0 8,3 0,6" fill="#9fd4e6"/>
          </marker>
        </defs>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
