<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
.title-slide {
  width: 1280px; height: 720px;
  display: flex; flex-direction: row;
  overflow: hidden;
}
.panel-dark {
  width: 38%;
  background: #1a1d2e;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 2.2rem 2.4rem;
  position: relative;
  overflow: hidden;
}
.panel-dark::before {
  content: '';
  position: absolute; top: -100px; left: -80px;
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(217,96,24,.25) 0%, transparent 65%);
  pointer-events: none;
}
.panel-dark::after {
  content: '';
  position: absolute; bottom: -60px; right: -60px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(26,150,192,.15) 0%, transparent 65%);
  pointer-events: none;
}
.ep-badge {
  display: inline-block;
  background: var(--g-orange);
  color: #fff;
  font-size: .68rem;
  font-weight: 700;
  padding: .18rem .7rem;
  border-radius: 99px;
  letter-spacing: .1em;
  margin-bottom: .9rem;
  width: fit-content;
}
.main-title {
  font-size: 2.2rem;
  font-weight: 900;
  color: #fff;
  line-height: 1.25;
  margin-bottom: .5rem;
}
.main-sub {
  font-size: .84rem;
  color: rgba(255,255,255,.55);
  margin-bottom: 1.6rem;
}
.count-badge {
  display: flex;
  align-items: center;
  gap: .6rem;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px;
  padding: .55rem .9rem;
  width: fit-content;
}
.count-badge .big-num {
  font-size: 2.2rem;
  font-weight: 900;
  color: var(--orange);
  line-height: 1;
}
.count-badge .count-label {
  font-size: .75rem;
  color: rgba(255,255,255,.65);
  line-height: 1.4;
}
.panel-light {
  flex: 1;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  padding: 2.2rem 2.8rem 1.8rem;
}
.point-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.bottom-info {
  display: flex;
  flex-direction: column;
  gap: .3rem;
}
.source-badge {
  display: inline-block;
  background: rgba(217,96,24,.1);
  color: var(--orange);
  font-size: .68rem;
  font-weight: 700;
  padding: .18rem .7rem;
  border-radius: 99px;
  margin-bottom: .9rem;
  width: fit-content;
}
.right-heading {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 1rem;
}
.point-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: .65rem;
}
.point-list li {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  font-size: .88rem;
  color: var(--text);
  line-height: 1.55;
}
.pnum {
  min-width: 22px; height: 22px;
  background: var(--g-orange);
  color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; font-weight: 700;
  flex-shrink: 0; margin-top: .05rem;
}
.credit {
  font-size: .68rem;
  color: var(--muted);
  opacity: .7;
}
</style>
</head>
<body>
<div class="title-slide">
  <div class="panel-dark">
    <span class="ep-badge">ep. 01</span>
    <div class="main-title">マルチエージェント<br>連携パターン<br>入門</div>
    <div class="main-sub">5つのパターンと使い分け</div>
    <div class="count-badge">
      <span class="big-num">5</span>
      <span class="count-label">coordination<br>patterns</span>
    </div>
  </div>
  <div class="panel-light">
    <div class="point-section">
      <span class="source-badge">📖 Anthropic ブログ解説</span>
      <div class="right-heading">Today's Points</div>
      <ul class="point-list">
        <li>
          <span class="pnum">1</span>
          複数のAIが協力する「チーム体制」の仕組みがわかる
        </li>
        <li>
          <span class="pnum">2</span>
          5つのパターンを場面に応じて使い分けられるようになる
        </li>
        <li>
          <span class="pnum">3</span>
          AIチームを実務に導入するための第一歩が踏み出せる
        </li>
      </ul>
    </div>
    <div class="bottom-info">
      <p class="credit">参考: Anthropic ブログ「Multi-agent coordination patterns: Five approaches and when to use them」（2026年4月10日）</p>
    </div>
  </div>
</div>
</body>
</html>
