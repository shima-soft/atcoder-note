<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:var(--g-blue);color:#fff">STEP 2 — インバウンド</span>
    <h2 class="slide-title">1時間ごとに受信箱を見て、返信の下書きを置く</h2>
    <div class="hitokoto" style="border-color:var(--blue)">
      <span class="badge" style="background:var(--blue)">一言で</span>
      <p>中身は「短い指示文 ＋ ナレッジベース ＋ 本人の文体」の3つだけ。特別な開発はしていない</p>
    </div>
  </div>
  <div class="slide-body">
    <div class="pattern-cols">
      <div class="diagram-box">
        <!--
          材料 box[i].x = 22 / y = 58 + i*82 (w=150, h=68, right=172)
          集約線 縦 x=188 (y 92→256) → Claude box x=226 w=112 (right=338)
          出力（主役・青） x=370 w=118 (right=488)
          viewBox: 0 0 500 420
        -->
        <svg viewBox="0 0 500 420" width="600" height="504" font-family="'Noto Sans JP','Meiryo',sans-serif">
          <text x="250" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d2e">下書きを作る3つの材料</text>

          <!-- 材料（脇役） -->
          <rect x="22" y="58" width="150" height="68" rx="9" fill="#f7f8fa" stroke="#dde2ec" stroke-width="1"/>
          <text x="97" y="87" text-anchor="middle" font-size="12.5" fill="#5e6a8a">短い指示文</text>
          <text x="97" y="105" text-anchor="middle" font-size="12.5" fill="#5e6a8a">（何をするか）</text>
          <rect x="22" y="140" width="150" height="68" rx="9" fill="#f7f8fa" stroke="#dde2ec" stroke-width="1"/>
          <text x="97" y="169" text-anchor="middle" font-size="12.5" fill="#5e6a8a">営業ナレッジベース</text>
          <text x="97" y="187" text-anchor="middle" font-size="12.5" fill="#5e6a8a">（製品の事実）</text>
          <rect x="22" y="222" width="150" height="68" rx="9" fill="#f7f8fa" stroke="#dde2ec" stroke-width="1"/>
          <text x="97" y="251" text-anchor="middle" font-size="12.5" fill="#5e6a8a">本人の文体の記録</text>
          <text x="97" y="269" text-anchor="middle" font-size="12.5" fill="#5e6a8a">（言い回しのくせ）</text>

          <!-- 集約線 -->
          <path d="M172 92 L188 92 L188 256 L172 256" fill="none" stroke="#c8cede" stroke-width="1.2"/>
          <path d="M172 174 L206 174" fill="none" stroke="#c8cede" stroke-width="1.2"/>
          <polygon points="206,166 220,174 206,182" fill="#5e6a8a"/>

          <!-- Claude（脇役） -->
          <rect x="226" y="140" width="112" height="68" rx="9" fill="#ffffff" stroke="#c8cede" stroke-width="1"/>
          <text x="282" y="169" text-anchor="middle" font-size="13" fill="#5e6a8a">Claude が</text>
          <text x="282" y="188" text-anchor="middle" font-size="13" fill="#5e6a8a">文面を作る</text>

          <polygon points="348,166 362,174 348,182" fill="#1a96c0"/>

          <!-- 出力（主役・青） -->
          <rect x="370" y="100" width="118" height="148" rx="12" fill="rgba(26,150,192,.07)" stroke="#1a96c0" stroke-width="2.5"/>
          <text x="429" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1a96c0">返信の下書き</text>
          <text x="384" y="162" font-size="11.5" fill="#5e6a8a">宛先・件名</text>
          <text x="384" y="188" font-size="11.5" fill="#5e6a8a">本文（案）</text>
          <text x="384" y="214" font-size="11.5" fill="#5e6a8a">送信前に確認</text>

          <polygon points="421,258 437,258 429,270" fill="#1a96c0"/>
          <rect x="370" y="280" width="118" height="62" rx="10" fill="#ffffff" stroke="#1a96c0" stroke-width="1.2"/>
          <text x="429" y="306" text-anchor="middle" font-size="12.5" fill="#1a1d2e">人が読んで直し</text>
          <text x="429" y="324" text-anchor="middle" font-size="12.5" fill="#1a1d2e">送信する</text>

          <text x="97" y="318" text-anchor="middle" font-size="12" fill="#5e6a8a">文体の記録も</text>
          <text x="97" y="336" text-anchor="middle" font-size="12" fill="#5e6a8a">Claude が作る</text>

          <text x="250" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d2e">1時間ごとに動き、未返信のスレッドを見つけて用意する</text>
        </svg>
      </div>
      <div class="info-col">
        <div class="biz-example">
          <div class="biz-title">🧭 動き方</div>
          <div class="biz-step">
            <span class="snum" style="background:var(--g-blue)">1</span>
            <p>1時間ごとに受信箱を走査し、まだ返していないやり取りを洗い出す</p>
          </div>
          <div class="biz-step">
            <span class="snum" style="background:var(--g-blue)">2</span>
            <p>製品の事実はナレッジベースから、言い回しは本人の文体から引く</p>
          </div>
          <div class="biz-step">
            <span class="snum" style="background:var(--g-blue)">3</span>
            <p>下書きのまま置かれる。読んで直して送るのは、あくまで人</p>
          </div>
        </div>
        <div class="ok-box">
          <div class="box-title">✅ 文体の記録がある効果</div>
          <ul class="box-list">
            <li>自分が書いた文書やメールを読ませて作る。届く文面が「自分の言葉」になる</li>
          </ul>
        </div>
        <div class="ng-box">
          <div class="box-title">⚠️ ここは外さない</div>
          <ul class="box-list">
            <li>自動送信にはしない。社外に出る文面は必ず人が最後に見る</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
