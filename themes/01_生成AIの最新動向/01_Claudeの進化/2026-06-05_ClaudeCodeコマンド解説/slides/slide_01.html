<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
.title-slide { width:1280px; height:720px; display:flex; overflow:hidden; }
.panel-dark {
  width:38%;
  background:#0d1b2a;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2.2rem 2.3rem;
}
.ep-badge { background:var(--g-blue); color:#fff; font-size:.68rem; font-weight:700; padding:.18rem .7rem; border-radius:99px; margin-bottom:.9rem; }
.main-title { color:#fff; font-size:2.05rem; font-weight:900; line-height:1.25; margin-bottom:.55rem; }
.main-sub { color:rgba(255,255,255,.68); font-size:.84rem; margin-bottom:1.45rem; }
.count-badge {
  display:flex;
  gap:.55rem;
  align-items:center;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  padding:.55rem .9rem;
}
.big-num { color:#2ab8e0; font-size:2.1rem; font-weight:900; line-height:1; }
.count-label { color:rgba(255,255,255,.68); font-size:.75rem; line-height:1.4; text-align:left; }
.panel-light { flex:1; background:var(--bg); display:flex; flex-direction:column; padding:2.2rem 2.8rem 1.8rem; }
.point-section { flex:1; display:flex; flex-direction:column; justify-content:center; }
.source-badge { display:inline-block; background:rgba(26,150,192,.1); color:var(--blue); font-size:.68rem; font-weight:700; padding:.18rem .7rem; border-radius:99px; margin-bottom:.9rem; width:fit-content; }
.feature-name { font-size:1rem; color:var(--muted); font-weight:700; margin-bottom:.35rem; }
.right-heading { font-size:1.1rem; font-weight:900; color:var(--text); margin-bottom:1rem; }
.point-list { list-style:none; display:flex; flex-direction:column; gap:.65rem; }
.point-list li { display:flex; gap:.6rem; font-size:.88rem; color:var(--text); line-height:1.55; }
.pnum { min-width:22px; height:22px; background:var(--g-blue); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; flex-shrink:0; margin-top:.05rem; }
.bottom-info { display:flex; flex-direction:column; gap:.3rem; }
.credit { font-size:.68rem; color:var(--muted); opacity:.78; line-height:1.5; }
</style>
</head>
<body>
<div class="title-slide">
  <div class="panel-dark">
    <span class="ep-badge">Claude Code</span>
    <div class="main-title">Claudeの<br>コマンド<br>解説</div>
    <div class="main-sub">起動・整理・レビューを流れで覚える</div>
    <div class="count-badge">
      <span class="big-num">2</span>
      <span class="count-label">command<br>layers</span>
    </div>
  </div>
  <div class="panel-light">
    <div class="point-section">
      <span class="source-badge">Claude Code Docs 公式リファレンス</span>
      <div class="feature-name">CLI commands + Slash commands</div>
      <div class="right-heading">Today's Points</div>
      <ul class="point-list">
        <li><span class="pnum">1</span><code>claude</code>で起動する外側のコマンドがわかる</li>
        <li><span class="pnum">2</span><code>/plan</code>や<code>/compact</code>など中で使うコマンドがわかる</li>
        <li><span class="pnum">3</span>仕事の流れに合わせて、必要なものだけ選べる</li>
      </ul>
    </div>
    <div class="bottom-info">
      <p class="credit">出典: Claude Code Docs「CLI reference」「Commands」（2026年6月5日確認）</p>
    </div>
  </div>
</div>
</body>
</html>
