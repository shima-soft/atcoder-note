<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ABC469 D: The Big Two</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f9fafb; }
    iframe { width: 100%; height: 100%; border: none; }
    .controls { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
    button { padding: 10px 20px; font-size: 1.2rem; cursor: pointer; border-radius: 8px; border: none; background: #d96018; color: #fff; }
    button:hover { background: #a34a14; }
  </style>
<!-- analytics:begin -->
<!-- Cloudflare Web Analytics -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "2fd81b548e44473da5496a5299f2430e"}'></script>
<!-- End Cloudflare Web Analytics -->
<!-- analytics:end -->
</head>
<body onload="initSlides()">
  <iframe id="slide-frame"></iframe>
  <div class="controls">
    <button id="prevBtn">前へ</button>
    <button id="nextBtn">次へ</button>
  </div>
  <script>
    const slides = [
      'slides/slide_01.html',
      'slides/slide_02.html',
      'slides/slide_03.html',
      'slides/slide_04.html',
      'slides/slide_05.html',
      'slides/slide_06.html',
      'slides/slide_07.html'
    ];
    let current = 0;
    const frame = document.getElementById('slide-frame');

    function initSlides() {
      if (slides[current]) {
        frame.src = slides[current];
      }
    }

    function nextSlide() {
      if (current < slides.length - 1) {
        current++;
        frame.src = slides[current];
      }
    }

    function prevSlide() {
      if (current > 0) {
        current--;
        frame.src = slides[current];
      }
    }

    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        nextSlide();
      }
      if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });
  </script>
</body>
</html>
