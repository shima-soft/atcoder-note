<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
.diagram-box {
  align-items: flex-start;
  padding: .8rem;
}
</style>
</head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-orange);color:#fff">考え方</span>
    <h2 class="slide-title">2つの条件を順番に確認する</h2>
    <div class="hitokoto" style="border-color:var(--orange)">
      <span class="badge" style="background:var(--orange)">ポイント</span>
      <p>「かつ」は両方OKで初めてYes — どちらか1つでも×ならNo</p>
    </div>
  </div>
  <div class="slide-body pattern-cols">

    <!-- SVG: 条件チェック図 -->
    <div class="diagram-box">
      <svg viewBox="0 0 540 330" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
        <!--
          box[i].x: A=18, B=222, C=426  (w=96, gap=108, 送り幅=204)
          box centers: A=66, B=270, C=474
        -->

        <!-- Number tiles -->
        <rect x="18" y="20" width="96" height="96" rx="14" fill="white" stroke="#dde2ec" stroke-width="2"/>
        <text x="66" y="84" text-anchor="middle" font-size="46" font-weight="900" fill="#1a1d2e" font-family="'Noto Sans JP',sans-serif">4</text>

        <rect x="222" y="20" width="96" height="96" rx="14" fill="white" stroke="#dde2ec" stroke-width="2"/>
        <text x="270" y="84" text-anchor="middle" font-size="46" font-weight="900" fill="#1a1d2e" font-family="'Noto Sans JP',sans-serif">5</text>

        <rect x="426" y="20" width="96" height="96" rx="14" fill="white" stroke="#dde2ec" stroke-width="2"/>
        <text x="474" y="84" text-anchor="middle" font-size="46" font-weight="900" fill="#1a1d2e" font-family="'Noto Sans JP',sans-serif">5</text>

        <!-- Variable labels below tiles -->
        <text x="66" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">A</text>
        <text x="270" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">B</text>
        <text x="474" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">C</text>

        <!-- Connector lines at mid-tile height y=68 -->
        <line x1="118" y1="68" x2="218" y2="68" stroke="#dde2ec" stroke-width="2"/>
        <line x1="322" y1="68" x2="422" y2="68" stroke="#dde2ec" stroke-width="2"/>

        <!-- Condition symbols above lines -->
        <!-- ≠ in red (condition 1: A≠B, satisfied) -->
        <text x="168" y="55" text-anchor="middle" font-size="22" font-weight="900" fill="#c9162e" font-family="'Noto Sans JP',sans-serif">≠</text>
        <!-- = in green (condition 2: B=C, satisfied) -->
        <text x="372" y="55" text-anchor="middle" font-size="22" font-weight="900" fill="#008f6a" font-family="'Noto Sans JP',sans-serif">=</text>

        <!-- Condition boxes -->
        <!-- Box 1 (A≠B): x=18, w=237 -->
        <rect x="18" y="152" width="237" height="62" rx="10" fill="rgba(201,22,46,.07)" stroke="rgba(201,22,46,.3)" stroke-width="1.5"/>
        <text x="136" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#c9162e" font-family="'Noto Sans JP',sans-serif">条件①</text>
        <text x="136" y="198" text-anchor="middle" font-size="14" font-weight="900" fill="#c9162e" font-family="'Noto Sans JP',sans-serif">A ≠ B（違う）✓</text>

        <!-- "かつ" label between boxes -->
        <text x="270" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">かつ</text>

        <!-- Box 2 (B=C): x=285, w=237 -->
        <rect x="285" y="152" width="237" height="62" rx="10" fill="rgba(0,143,106,.07)" stroke="rgba(0,143,106,.3)" stroke-width="1.5"/>
        <text x="403" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#008f6a" font-family="'Noto Sans JP',sans-serif">条件②</text>
        <text x="403" y="198" text-anchor="middle" font-size="14" font-weight="900" fill="#008f6a" font-family="'Noto Sans JP',sans-serif">B = C（同じ）✓</text>

        <!-- Arrow down -->
        <line x1="270" y1="220" x2="270" y2="255" stroke="#5e6a8a" stroke-width="2"/>
        <polygon points="263,252 277,252 270,263" fill="#5e6a8a"/>

        <!-- Result box -->
        <rect x="145" y="265" width="250" height="52" rx="12" fill="rgba(0,143,106,.1)" stroke="#008f6a" stroke-width="2"/>
        <text x="270" y="285" text-anchor="middle" font-size="12" fill="#008f6a" font-weight="700" font-family="'Noto Sans JP',sans-serif">入力例 4 5 5:</text>
        <text x="270" y="305" text-anchor="middle" font-size="17" fill="#008f6a" font-weight="900" font-family="'Noto Sans JP',sans-serif">両方OK → Yes ✓</text>
      </svg>
    </div>

    <!-- 右カラム: 説明 -->
    <div class="info-col">

      <div class="biz-example">
        <div class="biz-title">💡 採点チェックで考える</div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">①</span>
          <p>「AとBは違う数？」 → 4と5 → <strong>違う ✓</strong></p>
        </div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">②</span>
          <p>「BとCは同じ数？」 → 5と5 → <strong>同じ ✓</strong></p>
        </div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">③</span>
          <p>両方OKなので → <strong>合格（Yes）</strong></p>
        </div>
      </div>

      <div class="ok-box">
        <div class="box-title" style="color:var(--green)">✅ Yesになる条件</div>
        <ul class="box-list">
          <li>A ≠ B（AとBが違う）</li>
          <li>B = C（BとCが同じ）</li>
          <li>上記の<strong>両方</strong>が成立したとき</li>
        </ul>
      </div>

      <div class="ng-box">
        <div class="box-title" style="color:var(--red)">❌ Noになる例</div>
        <ul class="box-list">
          <li>1 3 7 → B=3 ≠ C=7 で条件②がNG</li>
          <li>6 6 6 → A=B=6 で条件①がNG</li>
        </ul>
      </div>

    </div>
  </div>
</div>
</body>
</html>
