<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ABC468 A - 3つずつの窓で見る</title>
<link rel="stylesheet" href="common.css">
<style>
.diagram-box {
  align-items: center;
  padding: .8rem;
}
</style>
</head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-orange);color:#fff">考え方</span>
    <h2 class="slide-title">3つずつの「窓」で山を探す</h2>
    <div class="hitokoto" style="border-color:var(--orange)">
      <span class="badge" style="background:var(--orange)">ポイント</span>
      <p>真ん中が左隣より大きく、右隣よりも大きければ「山」を1つカウント</p>
    </div>
  </div>
  <div class="slide-body pattern-cols">

    <div class="diagram-box">
      <svg viewBox="0 0 540 330" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
        <!--
          box[i].x = 64 + i*70  (boxWidth=62, gap=8, 送り幅=70)
          centers  = 95,165,235,305,375,445
          窓ゾーン: box1-3 → x=128, w=214 (right=342)
        -->

        <!-- 窓ゾーン背景（主役） -->
        <rect x="128" y="60" width="214" height="80" rx="12" fill="rgba(217,96,24,.09)" stroke="var(--orange)" stroke-width="2.5"/>

        <!-- 山の形（ピーク） -->
        <text x="235" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="var(--orange)" font-family="'Noto Sans JP',sans-serif">山（ピーク）</text>
        <polyline points="165,68 235,40 305,68" fill="none" stroke="var(--orange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="235" cy="40" r="5" fill="var(--orange)"/>

        <!-- 脇役の数字（窓の外） -->
        <rect x="64" y="68" width="62" height="64" rx="10" fill="#ffffff" stroke="#dde2ec" stroke-width="1.5"/>
        <text x="95" y="110" text-anchor="middle" font-size="30" font-weight="700" fill="#9aa3bd" font-family="'Noto Sans JP',sans-serif">3</text>

        <rect x="344" y="68" width="62" height="64" rx="10" fill="#ffffff" stroke="#dde2ec" stroke-width="1.5"/>
        <text x="375" y="110" text-anchor="middle" font-size="30" font-weight="700" fill="#9aa3bd" font-family="'Noto Sans JP',sans-serif">5</text>

        <rect x="414" y="68" width="62" height="64" rx="10" fill="#ffffff" stroke="#dde2ec" stroke-width="1.5"/>
        <text x="445" y="110" text-anchor="middle" font-size="30" font-weight="700" fill="#9aa3bd" font-family="'Noto Sans JP',sans-serif">2</text>

        <!-- 主役の数字（窓の中） -->
        <rect x="134" y="68" width="62" height="64" rx="10" fill="#ffffff" stroke="var(--orange)" stroke-width="2.5"/>
        <text x="165" y="110" text-anchor="middle" font-size="30" font-weight="900" fill="#1a1d2e" font-family="'Noto Sans JP',sans-serif">1</text>

        <rect x="204" y="68" width="62" height="64" rx="10" fill="#ffffff" stroke="var(--orange)" stroke-width="2.5"/>
        <text x="235" y="110" text-anchor="middle" font-size="30" font-weight="900" fill="#1a1d2e" font-family="'Noto Sans JP',sans-serif">4</text>

        <rect x="274" y="68" width="62" height="64" rx="10" fill="#ffffff" stroke="var(--orange)" stroke-width="2.5"/>
        <text x="305" y="110" text-anchor="middle" font-size="30" font-weight="900" fill="#1a1d2e" font-family="'Noto Sans JP',sans-serif">1</text>

        <!-- 位置ラベル -->
        <text x="95"  y="156" text-anchor="middle" font-size="12" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">1番目</text>
        <text x="165" y="156" text-anchor="middle" font-size="12" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">2番目</text>
        <text x="235" y="156" text-anchor="middle" font-size="12" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">3番目</text>
        <text x="305" y="156" text-anchor="middle" font-size="12" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">4番目</text>
        <text x="375" y="156" text-anchor="middle" font-size="12" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">5番目</text>
        <text x="445" y="156" text-anchor="middle" font-size="12" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">6番目</text>

        <!-- 判定へ -->
        <line x1="235" y1="172" x2="235" y2="196" stroke="#5e6a8a" stroke-width="2"/>
        <polygon points="228,193 242,193 235,204" fill="#5e6a8a"/>

        <rect x="75" y="214" width="320" height="76" rx="12" fill="rgba(0,143,106,.1)" stroke="var(--green)" stroke-width="2"/>
        <text x="235" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="var(--green)" font-family="'Noto Sans JP',sans-serif">1 &lt; 4 かつ 4 &gt; 1</text>
        <text x="235" y="272" text-anchor="middle" font-size="17" font-weight="900" fill="var(--green)" font-family="'Noto Sans JP',sans-serif">真ん中が両隣より大きい → 山！</text>

        <!-- 凡例 -->
        <rect x="300" y="302" width="11" height="11" rx="2" fill="rgba(217,96,24,.09)" stroke="var(--orange)" stroke-width="2"/>
        <text x="316" y="311" font-size="10" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">調べている3つ</text>
        <rect x="398" y="302" width="11" height="11" rx="2" fill="#ffffff" stroke="#dde2ec" stroke-width="1.5"/>
        <text x="414" y="311" font-size="10" fill="#5e6a8a" font-family="'Noto Sans JP',sans-serif">それ以外</text>
      </svg>
    </div>

    <div class="info-col">

      <div class="biz-example">
        <div class="biz-title">💡 日別の売上表から「ピークの日」を探す</div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">①</span>
          <p>前日・当日・翌日の3日分をまとめて見る</p>
        </div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">②</span>
          <p>当日が前日より多く、翌日より多ければピーク</p>
        </div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">③</span>
          <p>見る位置を1日ずつずらし、ピークの日数を数える</p>
        </div>
      </div>

      <div class="ok-box">
        <div class="box-title" style="color:var(--green)">✅ 山になる形</div>
        <ul class="box-list">
          <li>「1 4 1」 — 上がってから下がる</li>
          <li>「8 10 3」 — 真ん中の10が一番大きい</li>
        </ul>
      </div>

      <div class="ng-box">
        <div class="box-title" style="color:var(--red)">❌ 山にならない形</div>
        <ul class="box-list">
          <li>「3 1 4」 — 真ん中が谷になっている</li>
          <li>「4 1 5」 — 真ん中が一番小さい</li>
        </ul>
      </div>

    </div>
  </div>
</div>
</body>
</html>
