<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:var(--g-orange);color:#fff">キー戦略①</span>
    <h2 class="slide-title">累積和で各シーケンスの範囲を計算</h2>
    <div class="hitokoto" style="border-color:var(--orange)">
      <span class="badge" style="background:var(--orange)">戦略</span>
      <p>各シーケンスが B 全体のどこからどこまでを占めるかを事前計算</p>
    </div>
  </div>
  <div class="slide-body pattern-cols">
    <div class="diagram-box">
      <svg viewBox="0 0 420 300" style="width:100%;height:100%;max-width:420px;">
        <!-- キャプション -->
        <text x="210" y="25" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1d2e">
          累積和の構築
        </text>

        <!-- テーブルヘッダ -->
        <rect x="10" y="40" width="50" height="25" fill="var(--orange)" rx="4"/>
        <text x="35" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">i</text>

        <rect x="65" y="40" width="70" height="25" fill="var(--orange)" rx="4"/>
        <text x="100" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">L_i</text>

        <rect x="140" y="40" width="70" height="25" fill="var(--orange)" rx="4"/>
        <text x="175" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">C_i</text>

        <rect x="215" y="40" width="95" height="25" fill="var(--orange)" rx="4"/>
        <text x="262" y="60" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">L_i × C_i</text>

        <rect x="315" y="40" width="95" height="25" fill="var(--g-orange)" rx="4"/>
        <text x="362" y="60" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">累積和</text>

        <!-- データ行1 -->
        <rect x="10" y="70" width="50" height="22" fill="#f5f6fa" stroke="var(--border)" stroke-width="1"/>
        <text x="35" y="87" font-size="11" text-anchor="middle" fill="#1a1d2e">1</text>

        <rect x="65" y="70" width="70" height="22" fill="#f5f6fa" stroke="var(--border)" stroke-width="1"/>
        <text x="100" y="87" font-size="11" text-anchor="middle" fill="#1a1d2e">3</text>

        <rect x="140" y="70" width="70" height="22" fill="#f5f6fa" stroke="var(--border)" stroke-width="1"/>
        <text x="175" y="87" font-size="11" text-anchor="middle" fill="#1a1d2e">1</text>

        <rect x="215" y="70" width="95" height="22" fill="#e8f5f0" stroke="var(--green)" stroke-width="1" stroke-dasharray="2,2"/>
        <text x="262" y="87" font-size="11" text-anchor="middle" fill="var(--green)">3 × 1 = 3</text>

        <rect x="315" y="70" width="95" height="22" fill="#fff8e8" stroke="var(--orange)" stroke-width="2"/>
        <text x="362" y="87" font-size="11" font-weight="700" text-anchor="middle" fill="var(--orange)">3</text>

        <!-- データ行2 -->
        <rect x="10" y="95" width="50" height="22" fill="#f5f6fa" stroke="var(--border)" stroke-width="1"/>
        <text x="35" y="112" font-size="11" text-anchor="middle" fill="#1a1d2e">2</text>

        <rect x="65" y="95" width="70" height="22" fill="#f5f6fa" stroke="var(--border)" stroke-width="1"/>
        <text x="100" y="112" font-size="11" text-anchor="middle" fill="#1a1d2e">3</text>

        <rect x="140" y="95" width="70" height="22" fill="#f5f6fa" stroke="var(--border)" stroke-width="1"/>
        <text x="175" y="112" font-size="11" text-anchor="middle" fill="#1a1d2e">3</text>

        <rect x="215" y="95" width="95" height="22" fill="#e8f5f0" stroke="var(--green)" stroke-width="1" stroke-dasharray="2,2"/>
        <text x="262" y="112" font-size="11" text-anchor="middle" fill="var(--green)">3 × 3 = 9</text>

        <rect x="315" y="95" width="95" height="22" fill="#fff8e8" stroke="var(--orange)" stroke-width="2"/>
        <text x="362" y="112" font-size="11" font-weight="700" text-anchor="middle" fill="var(--orange)">3 + 9 = 12</text>

        <!-- データ行3 -->
        <rect x="10" y="120" width="50" height="22" fill="#f5f6fa" stroke="var(--border)" stroke-width="1"/>
        <text x="35" y="137" font-size="11" text-anchor="middle" fill="#1a1d2e">3</text>

        <rect x="65" y="120" width="70" height="22" fill="#f5f6fa" stroke="var(--border)" stroke-width="1"/>
        <text x="100" y="137" font-size="11" text-anchor="middle" fill="#1a1d2e">3</text>

        <rect x="140" y="120" width="70" height="22" fill="#f5f6fa" stroke="var(--border)" stroke-width="1"/>
        <text x="175" y="137" font-size="11" text-anchor="middle" fill="#1a1d2e">2</text>

        <rect x="215" y="120" width="95" height="22" fill="#e8f5f0" stroke="var(--green)" stroke-width="1" stroke-dasharray="2,2"/>
        <text x="262" y="137" font-size="11" text-anchor="middle" fill="var(--green)">3 × 2 = 6</text>

        <rect x="315" y="120" width="95" height="22" fill="#fff8e8" stroke="var(--orange)" stroke-width="2"/>
        <text x="362" y="137" font-size="11" font-weight="700" text-anchor="middle" fill="var(--orange)">12 + 6 = 18</text>

        <!-- 矢印と説明 -->
        <text x="10" y="165" font-size="11" font-weight="700" fill="#1a1d2e">
          📍 位置範囲:
        </text>
        <text x="10" y="180" font-size="10" font-family="Monaco" fill="#5e6a8a">
          A[1]: 位置 1～3
        </text>
        <text x="10" y="193" font-size="10" font-family="Monaco" fill="#5e6a8a">
          A[2]: 位置 4～12
        </text>
        <text x="10" y="206" font-size="10" font-family="Monaco" fill="#5e6a8a">
          A[3]: 位置 13～18
        </text>

        <!-- ポイント -->
        <rect x="10" y="220" width="400" height="65" fill="rgba(217,96,24,.08)" stroke="var(--orange)" stroke-width="1" rx="6"/>
        <text x="20" y="237" font-size="10" font-weight="700" fill="var(--orange)">
          💡 K=9 の場合:
        </text>
        <text x="20" y="250" font-size="9" fill="#1a1d2e">
          累積和で 9 がどの区間に属するか見つかる
        </text>
        <text x="20" y="263" font-size="9" fill="#1a1d2e">
          A[2] の区間 [4, 12] に含まれる → A[2] の内部インデックス = 6
        </text>
        <text x="20" y="276" font-size="9" fill="#1a1d2e">
          A[2][6 % 3] = A[2][0] = 2
        </text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">🎯 Step 1: 累積和を構築</div>
        <div class="biz-step">
          <div class="snum" style="background:var(--g-orange);">1</div>
          <p>各シーケンス A_i の長さ L_i と繰り返し数 C_i から、<strong>L_i × C_i</strong> を計算</p>
        </div>
        <div class="biz-step">
          <div class="snum" style="background:var(--g-orange);">2</div>
          <p>累積和の配列を作成：<strong>cumsum[i]</strong> = Σ(L_j × C_j) for j ≤ i</p>
        </div>
      </div>
      <div class="ok-box">
        <div class="box-title">✅ 累積和の利点</div>
        <ul class="box-list">
          <li>O(N) で前計算完了</li>
          <li>全体のサイズは Σ(L_i) ≤ 2×10⁵</li>
          <li>メモリ安全</li>
        </ul>
      </div>
      <div class="ng-box">
        <div class="box-title">⚠️ 注意</div>
        <ul class="box-list">
          <li>L_i × C_i が int を超える場合がある</li>
          <li>Python は大数対応なので OK</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
