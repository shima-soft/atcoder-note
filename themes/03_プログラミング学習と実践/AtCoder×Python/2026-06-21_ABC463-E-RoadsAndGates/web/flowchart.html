<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABC463 E 思考フローチャート</title><style>:root{--bg:#f9fafb;--card:#fff;--border:#dde2ec;--text:#1a1d2e;--muted:#5e6a8a;--orange:#d96018;--green:#008f6a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:sans-serif;color:var(--text);line-height:1.7}.wrap{max-width:720px;margin:3rem auto;padding:1rem}h1{font-size:1.8rem}.q,.result{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin:.8rem 0}.q strong{display:block;margin-bottom:.5rem}button,a{display:inline-block;margin:.2rem;padding:.45rem .8rem;border:1px solid var(--orange);border-radius:8px;background:#fff;color:var(--orange);font-weight:700;text-decoration:none;cursor:pointer}.result{display:none;border-left:5px solid var(--green)}.muted{color:var(--muted)}</style></head><body><div class="wrap"><p><a href="index.html">← 解説へ戻る</a></p><h1>この問題で超頂点を思いつくまで</h1><p class="muted">3つの問いに順に答えて、思考ルートを確認します。</p><div class="q" id="q1"><strong>Q1. 全都市ペアのワープ辺を作れる？</strong><button onclick="next(1)">N=20万なので無理</button></div><div class="q" id="q2" style="display:none"><strong>Q2. 料金式に全ペアで共通する形はある？</strong><button onclick="next(2)">Xᵢ + Y + Xⱼ に分かれる</button></div><div class="q" id="q3" style="display:none"><strong>Q3. 3つの費用を経路として表せる？</strong><button onclick="next(3)">入口と出口の超頂点を置く</button></div><div class="result" id="result"><h2>通常の最短経路問題へ！</h2><p>都市→入口→出口→都市の3辺を追加し、都市1からダイクストラ法を実行します。</p></div></div><script>function next(n){if(n<3)document.getElementById('q'+(n+1)).style.display='block';else document.getElementById('result').style.display='block'}</script></body></html>
