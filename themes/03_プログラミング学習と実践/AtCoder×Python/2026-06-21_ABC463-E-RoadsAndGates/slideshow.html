<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>ABC463 E — Roads and Gates</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1d2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:sans-serif}.frame-wrap{position:relative;width:min(100vw,calc((100vh - 60px)*1.7778))}iframe{width:1280px;height:720px;border:0;transform-origin:top left;position:absolute;inset:0;border-radius:8px}.nav{display:flex;gap:1rem;margin-top:.8rem;color:#aaa;font-size:13px;align-items:center}button{background:#2e3250;color:#ddd;border:0;padding:.35rem .9rem;border-radius:6px;cursor:pointer}.dots{display:flex;gap:.3rem}.dot{width:8px;height:8px;border-radius:50%;background:#444;cursor:pointer}.dot.active{background:#d96018}</style><!-- analytics:begin -->

<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "2fd81b548e44473da5496a5299f2430e"}'></script>

</head>
<body><div class="frame-wrap" id="wrap"><iframe id="slide" src="slides/slide_01.html"></iframe></div><div class="nav"><button id="prev" onclick="go(-1)" disabled>◀ 前へ</button><div class="dots" id="dots"></div><span id="info">1 / 13</span><button id="next" onclick="go(1)">次へ ▶</button></div>
<script>let cur=1;const total=13,dots=document.getElementById('dots');for(let i=1;i<=total;i++){const d=document.createElement('div');d.className='dot'+(i===1?' active':'');d.onclick=()=>jump(i);dots.appendChild(d)}function jump(n){cur=Math.max(1,Math.min(total,n));slide.src=`slides/slide_${String(cur).padStart(2,'0')}.html`;info.textContent=`${cur} / ${total}`;prev.disabled=cur===1;next.disabled=cur===total;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i+1===cur))}function go(d){jump(cur+d)}function resize(){const s=wrap.offsetWidth/1280;slide.style.transform=`scale(${s})`;wrap.style.height=720*s+'px'}addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});resize()</script></body></html>
