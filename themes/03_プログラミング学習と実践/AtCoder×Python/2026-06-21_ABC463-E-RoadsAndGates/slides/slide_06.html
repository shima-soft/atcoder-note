<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css"><style>.trace{display:grid;grid-template-columns:1.05fr .95fr;gap:.8rem;flex:1}.case{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:.75rem .9rem;display:flex;flex-direction:column}.case h3{font-size:1rem;margin-bottom:.35rem}.row{display:grid;grid-template-columns:1fr 90px;gap:.4rem;align-items:center;padding:.42rem .5rem;border-bottom:1px solid var(--border);font-size:.8rem}.sum{color:var(--orange);font-weight:900}.result{margin-top:auto;padding:.6rem;border-radius:10px;text-align:center;font-size:.9rem;font-weight:900}.formula{font-family:Consolas,monospace;color:var(--muted)}.mini-route{display:flex;flex-direction:column;gap:.45rem;margin-top:.25rem}.step{display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;border-radius:10px;background:var(--surface);font-size:.8rem}.step b{min-width:35px;color:var(--orange)}</style></head><body><div class="slide surface"><div class="slide-header"><span class="label" style="background:var(--g-orange);color:#fff">サンプルを追う</span><h2 class="slide-title">都市1 → 都市2 → ワープ → 都市7</h2><p class="slide-sub">超頂点の経路でも、元のワープ費用と完全に一致する</p></div><div class="slide-body"><div class="trace"><div class="case"><h3>元の問題での移動</h3><div class="row"><span>都市1 → 都市2（道路）</span><span class="sum">1分</span></div><div class="row"><span>都市2 → 都市7（ワープ）</span><span class="sum">6分</span></div><div class="mini-route"><div class="step"><b>X₂</b><span>都市2 → 入口 Wₛ：1分</span></div><div class="step"><b>Y</b><span>入口 Wₛ → 出口 Wₜ：3分</span></div><div class="step"><b>X₇</b><span>出口 Wₜ → 都市7：2分</span></div></div><div class="result" style="background:#eaf8f3;color:var(--green)">1 + (1 + 3 + 2) = 7分</div></div><div class="case"><h3>圧縮後のグラフ</h3><svg viewBox="0 0 470 310" width="100%" height="100%" role="img" aria-label="サンプルの最短経路"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#008f6a"/></marker></defs><g fill="#fff" stroke="#d96018" stroke-width="3"><rect x="20" y="116" width="82" height="52" rx="10"/><rect x="128" y="116" width="82" height="52" rx="10"/><rect x="370" y="116" width="82" height="52" rx="10"/></g><g fill="#fff" stroke-width="3"><rect x="238" y="35" width="94" height="52" rx="10" stroke="#1a96c0"/><rect x="238" y="230" width="94" height="52" rx="10" stroke="#7a3bce"/></g><g text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d2e"><text x="61" y="147">都市1</text><text x="169" y="147">都市2</text><text x="411" y="147">都市7</text><text x="285" y="66">入口 Wₛ</text><text x="285" y="261">出口 Wₜ</text></g><g stroke="#008f6a" stroke-width="4" fill="none" marker-end="url(#arr)"><path d="M102 142 L120 142"/><path d="M190 114 Q215 75 235 66"/><path d="M285 87 L285 222"/><path d="M332 256 Q365 225 394 174"/></g><g font-size="13" font-weight="900" fill="#008f6a"><text x="108" y="130">1</text><text x="209" y="81">1</text><text x="297" y="164">3</text><text x="363" y="221">2</text></g></svg></div></div></div></div></body></html>
