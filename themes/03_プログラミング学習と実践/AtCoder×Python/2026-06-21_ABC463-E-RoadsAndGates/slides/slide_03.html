<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css"></head><body><div class="slide"><div class="slide-header"><span class="label" style="background:var(--g-orange);color:#fff">失敗アプローチ</span><h2 class="slide-title">全都市ペアのワープ辺を作る？</h2><div class="hitokoto"><span class="badge" style="background:var(--red)">MLE / TLE</span><p>20万都市の完全グラフは、約400億本の辺になります</p></div></div><div class="pattern-cols slide-body"><div class="diagram-box"><svg viewBox="0 0 620 430" width="100%" height="100%" role="img" aria-label="完全グラフの辺数爆発"><text x="310" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1d2e">どの都市からも、全都市へワープ可能</text><g fill="#fff" stroke="#d96018" stroke-width="3"><circle cx="310" cy="100" r="34"/><circle cx="145" cy="190" r="34"/><circle cx="475" cy="190" r="34"/><circle cx="205" cy="335" r="34"/><circle cx="415" cy="335" r="34"/></g><g stroke="#c9162e" stroke-width="2" opacity=".7"><path d="M285 120 L170 172 M335 120 L450 172 M300 133 L215 302 M320 133 L405 302 M175 210 L205 301 M178 195 L442 195 M172 210 L385 321 M450 210 L235 321 M445 211 L415 301 M235 335 L381 335"/></g><g text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d2e"><text x="310" y="106">都市1</text><text x="145" y="196">都市2</text><text x="475" y="196">都市3</text><text x="205" y="341">都市4</text><text x="415" y="341">…都市N</text></g><rect x="120" y="375" width="380" height="42" rx="10" fill="#fff1f2" stroke="#c9162e" stroke-width="2"/><text x="310" y="402" text-anchor="middle" font-size="17" font-weight="900" fill="#c9162e">N(N−1) ≒ 400億本</text></svg></div><div class="info-col"><div class="ng-box"><div class="box-title">素直に作ると</div><ul class="box-list"><li>都市i→jを全ペア登録する</li><li>辺数O(N²)で、メモリも時間も破綻</li></ul></div><div class="biz-example"><div class="biz-title">式に共通部分がある</div><div class="biz-step"><span class="snum" style="background:var(--orange)">1</span><p>出発側の費用 X<sub>i</sub></p></div><div class="biz-step"><span class="snum" style="background:var(--blue)">2</span><p>全員共通の費用 Y</p></div><div class="biz-step"><span class="snum" style="background:var(--green)">3</span><p>到着側の費用 X<sub>j</sub></p></div></div><div class="note-box"><div class="box-title">仕事でたとえると</div><ul class="box-list"><li>全支店間の直通便を作らず、共通の物流センターへ集約する設計</li></ul></div></div></div></div></body></html>
