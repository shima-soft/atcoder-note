<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css"></head><body><div class="slide"><div class="slide-header"><span class="label" style="background:var(--g-orange);color:#fff">最短経路</span><h2 class="slide-title">あとはダイクストラ法を1回</h2><div class="hitokoto"><span class="badge" style="background:var(--blue)">DIJKSTRA</span><p>すべての辺のコストが正なので、近い都市から確定できる</p></div></div><div class="pattern-cols slide-body"><div class="diagram-box"><svg viewBox="0 0 620 430" width="100%" height="100%" role="img" aria-label="ダイクストラ法の優先度付きキュー"><text x="310" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1d2e">都市1からの暫定距離</text><g fill="#fff" stroke="#dde2ec" stroke-width="2"><rect x="55" y="80" width="150" height="64" rx="12"/><rect x="235" y="80" width="150" height="64" rx="12"/><rect x="415" y="80" width="150" height="64" rx="12"/></g><g text-anchor="middle"><text x="130" y="106" font-size="14" fill="#5e6a8a">都市2</text><text x="130" y="132" font-size="20" font-weight="900" fill="#008f6a">1分</text><text x="310" y="106" font-size="14" fill="#5e6a8a">都市3</text><text x="310" y="132" font-size="20" font-weight="900" fill="#d96018">6分</text><text x="490" y="106" font-size="14" fill="#5e6a8a">入口 Wₛ</text><text x="490" y="132" font-size="20" font-weight="900" fill="#1a96c0">3分</text></g><path d="M130 160 L130 220" stroke="#008f6a" stroke-width="4"/><rect x="92" y="205" width="76" height="36" rx="18" fill="#008f6a"/><text x="130" y="229" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">最小</text><rect x="100" y="275" width="420" height="92" rx="14" fill="#fff7ed" stroke="#d96018" stroke-width="2"/><text x="310" y="307" text-anchor="middle" font-size="17" font-weight="900" fill="#d96018">優先度付きキュー</text><text x="310" y="336" text-anchor="middle" font-size="15" fill="#1a1d2e">距離が最小の候補を取り出す</text><text x="310" y="358" text-anchor="middle" font-size="14" fill="#5e6a8a">→ 隣接する辺で距離を更新</text></svg></div><div class="info-col"><div class="biz-example"><div class="biz-title">処理の流れ</div><div class="biz-step"><span class="snum" style="background:var(--orange)">1</span><p>都市1の距離を0、ほかを∞にする</p></div><div class="biz-step"><span class="snum" style="background:var(--green)">2</span><p>距離が最小の頂点をheapから取り出す</p></div><div class="biz-step"><span class="snum" style="background:var(--blue)">3</span><p>そこから行ける頂点の距離を短く更新</p></div><div class="biz-step"><span class="snum" style="background:var(--purple)">4</span><p>heapが空になるまで繰り返す</p></div></div><div class="ok-box"><div class="box-title">圧縮後の規模</div><ul class="box-list"><li>頂点数：N + 2</li><li>辺数：2M + 2N + 1（有向辺として数える）</li></ul></div><div class="note-box"><div class="box-title">Pythonの目安</div><ul class="box-list"><li>O((N+M) log N) はN,Mが数十万でも現実的</li></ul></div></div></div></div></body></html>
