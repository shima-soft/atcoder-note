<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
.info-col { gap: .55rem; }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-orange);color:#fff">考え方</span>
    <h2 class="slide-title">なぜ R − L + 1 なのか？</h2>
    <div class="hitokoto" style="border-color:var(--orange)">
      <span class="badge" style="background:var(--orange)">ポイント</span>
      <p>「差」は移動の数、「個数」は移動 + 1 — 両端を含むから1つ多い</p>
    </div>
  </div>
  <div class="slide-body pattern-cols">

    <!-- 左: SVG図 -->
    <div class="diagram-box">
      <!--
        box[i].x = 71 + i*58, width=50, 7個（数字1〜7）
        box[2]=3(L), box[3]=4, box[4]=5(R) → オレンジ
        bracket: x=197〜363, y=100
        BEFORE box: x=20, w=238; AFTER box: x=278, w=238
        viewBox: 0 0 540 330
      -->
      <svg viewBox="0 0 540 330" width="100%" height="100%" font-family="'Noto Sans JP','Hiragino Sans','Meiryo',sans-serif">

        <!-- タイトル -->
        <text x="270" y="20" text-anchor="middle" font-size="12" fill="#5e6a8a" font-weight="700">例：L = 3, R = 5 の場合</text>

        <!-- 数字ボックス 1〜7 (y=30, height=40) -->
        <!-- box[i].x = 71 + i*58, center = 96 + i*58 -->

        <!-- 1 (gray) -->
        <rect x="71" y="30" width="50" height="40" rx="8" fill="#eff1f7" stroke="#dde2ec" stroke-width="1.5"/>
        <text x="96" y="57" text-anchor="middle" font-size="16" fill="#5e6a8a" font-weight="700">1</text>

        <!-- 2 (gray) -->
        <rect x="129" y="30" width="50" height="40" rx="8" fill="#eff1f7" stroke="#dde2ec" stroke-width="1.5"/>
        <text x="154" y="57" text-anchor="middle" font-size="16" fill="#5e6a8a" font-weight="700">2</text>

        <!-- 3 (L, orange) -->
        <rect x="187" y="30" width="50" height="40" rx="8" fill="rgba(217,96,24,.14)" stroke="#d96018" stroke-width="2.5"/>
        <text x="212" y="57" text-anchor="middle" font-size="16" fill="#d96018" font-weight="900">3</text>
        <text x="212" y="84" text-anchor="middle" font-size="10" fill="#d96018" font-weight="700">L</text>

        <!-- 4 (orange) -->
        <rect x="245" y="30" width="50" height="40" rx="8" fill="rgba(217,96,24,.14)" stroke="#d96018" stroke-width="2.5"/>
        <text x="270" y="57" text-anchor="middle" font-size="16" fill="#d96018" font-weight="900">4</text>

        <!-- 5 (R, orange) -->
        <rect x="303" y="30" width="50" height="40" rx="8" fill="rgba(217,96,24,.14)" stroke="#d96018" stroke-width="2.5"/>
        <text x="328" y="57" text-anchor="middle" font-size="16" fill="#d96018" font-weight="900">5</text>
        <text x="328" y="84" text-anchor="middle" font-size="10" fill="#d96018" font-weight="700">R</text>

        <!-- 6 (gray) -->
        <rect x="361" y="30" width="50" height="40" rx="8" fill="#eff1f7" stroke="#dde2ec" stroke-width="1.5"/>
        <text x="386" y="57" text-anchor="middle" font-size="16" fill="#5e6a8a" font-weight="700">6</text>

        <!-- 7 (gray) -->
        <rect x="419" y="30" width="50" height="40" rx="8" fill="#eff1f7" stroke="#dde2ec" stroke-width="1.5"/>
        <text x="444" y="57" text-anchor="middle" font-size="16" fill="#5e6a8a" font-weight="700">7</text>

        <!-- ブラケット: L=3(x=187) 〜 R=5(右端x=353) -->
        <path d="M 187 95 L 187 103 L 353 103 L 353 95" fill="none" stroke="#d96018" stroke-width="2"/>
        <text x="270" y="120" text-anchor="middle" font-size="13" fill="#d96018" font-weight="900">3 個</text>

        <!-- 区切り線 -->
        <line x1="20" y1="135" x2="520" y2="135" stroke="#dde2ec" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- ❌ 間違い: R - L -->
        <rect x="20" y="145" width="238" height="80" rx="10" fill="rgba(201,22,46,.07)" stroke="rgba(201,22,46,.3)" stroke-width="1.5"/>
        <text x="34" y="166" font-size="11" fill="#c9162e" font-weight="700">❌ よくある間違い</text>
        <text x="34" y="188" font-size="14" fill="#c9162e" font-weight="900">R − L = 5 − 3 = 2</text>
        <text x="34" y="209" font-size="11" fill="#5e6a8a">→ 実際は 3 個なのに 1 個足りない</text>

        <!-- ✅ 正解: R - L + 1 -->
        <rect x="282" y="145" width="238" height="80" rx="10" fill="rgba(0,143,106,.07)" stroke="rgba(0,143,106,.3)" stroke-width="1.5"/>
        <text x="296" y="166" font-size="11" fill="#008f6a" font-weight="700">✅ 正解の式</text>
        <text x="296" y="188" font-size="14" fill="#008f6a" font-weight="900">R − L + 1 = 5 − 3 + 1 = 3</text>
        <text x="296" y="209" font-size="11" fill="#5e6a8a">→ 両端を含むから +1 する</text>

        <!-- 直感ボックス -->
        <rect x="20" y="240" width="500" height="68" rx="10" fill="rgba(217,96,24,.06)" stroke="rgba(217,96,24,.2)" stroke-width="1.5"/>
        <text x="270" y="260" text-anchor="middle" font-size="11" fill="#5e6a8a" font-weight="700">💡 なぜ「差 + 1」なのか</text>
        <text x="270" y="280" text-anchor="middle" font-size="12" fill="#1a1d2e">「3 から 5」は 3→4 と 4→5 の 2 ステップ</text>
        <text x="270" y="298" text-anchor="middle" font-size="12" fill="#1a1d2e">でも数えるのは整数の個数（3・4・5 の 3 つ）→ ステップ数 + 1 が答え</text>

      </svg>
    </div>

    <!-- 右: 説明カラム -->
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">💡 身近な例で考えてみよう</div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">例</span>
          <p>「社員番号 3 番から 5 番まで来てください」</p>
        </div>
        <div class="biz-step">
          <span class="snum" style="background:var(--red)">❌</span>
          <p>5 − 3 = 2 人？　→　いいえ！</p>
        </div>
        <div class="biz-step">
          <span class="snum" style="background:var(--green)">✅</span>
          <p>3番・4番・5番 の <strong>3 人</strong>が正解</p>
        </div>
      </div>

      <div class="ng-box">
        <div class="box-title">⚠️ ありがちな間違い</div>
        <ul class="box-list">
          <li>R − L を答えてしまう（1 個足りない）</li>
          <li>「以上・以下」を見落として片端を除く</li>
        </ul>
      </div>

      <div class="ok-box">
        <div class="box-title">✅ 正しい考え方</div>
        <ul class="box-list">
          <li>「両端を含む（閉区間）」= 個数は R − L + 1</li>
          <li>サンプルで確かめると必ず +1 が必要とわかる</li>
        </ul>
      </div>
    </div>

  </div>
</div>
</body>
</html>
