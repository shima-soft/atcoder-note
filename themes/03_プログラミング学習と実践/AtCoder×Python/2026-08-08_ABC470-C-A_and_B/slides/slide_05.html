<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC470 C - A and B 解説</title>
  <link rel="stylesheet" href="../../specs/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <style>
    pre code.hljs { background: transparent !important; padding: 0 !important; }
  </style>
</head>
<body>
  <div class="slide surface">
    <div class="slide-header">
      <span class="label" style="background:var(--g-orange);color:#fff">アルゴリズム解説 (2)</span>
      <h2 class="slide-title">ビット演算の活用</h2>
      <div class="hitokoto" style="border-color:var(--orange)">
        <span class="badge" style="background:var(--orange)">一言で</span>
        <p>ビットの状態を配列として管理し、必要な部分だけを書き換える</p>
      </div>
    </div>
    <div class="pattern-cols slide-body">
      <div class="diagram-box">
        <svg width="600" height="400" viewBox="0 0 600 400">
          <!-- 配列の箱 -->
          <rect x="50" y="150" width="500" height="100" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="2" />
          <text x="300" y="130" text-anchor="middle" font-weight="bold">ビットの状態を保持する配列</text>
          
          <!-- インデックス -->
          <text x="100" y="185" text-anchor="middle" font-size="14" fill="var(--muted)">0</text>
          <text x="200" y="185" text-anchor="middle" font-size="14" fill="var(--muted)">1</text>
          <text x="300" y="185" text-anchor="middle" font-size="14" fill="var(--muted)">2</text>
          <text x="400" y="185" text-anchor="middle" font-size="14" fill="var(--muted)">3</text>

          <!-- 配列の内容 -->
          <rect x="80" y="150" width="80" height="80" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1" />
          <text x="120" y="195" text-anchor="middle" font-size="20">0</text>
          
          <rect x="180" y="150" width="80" height="80" rx="5" fill="var(--orange)" stroke="var(--orange)" stroke-width="3" />
          <text x="220" y="195" text-anchor="middle" font-size="20" font-weight="bold">1</text>
          
          <rect x="280" y="150" width="80" height="80" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1" />
          <text x="320" y="195" text-anchor="middle" font-size="20">1</text>
          
          <rect x="380" y="150" width="80" height="80" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1" />
          <text x="420" y="195" text-anchor="middle" font-size="20">1</text>

          <!-- 書き換え操作 -->
          <path d="M 220 230 L 220 300 L 400 300" stroke="var(--orange)" stroke-width="4" fill="none" marker-end="url(#arrow)" />
          <text x="310" y="320" text-anchor="middle" font-size="14" fill="var(--orange)">クエリ：ビット1を反転 → 配列[1]を書き換え</text>

          <defs>
            <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3.5" orient="auto">
              <path d="M0,0 L0,10 L10,5 Z" fill="var(--orange)" />
            </marker>
          </defs>
        </svg>
      </div>
      <div class="info-col">
        <div class="biz-example">
          <h4 style="margin:0">💡 ここがポイント</h4>
          <p>整数全体をいじらず、**必要なビットのインデックスだけ**を操作対象にする。</p>
        </div>
        <div class="ok-box">
          <div class="box-title">✅ 得られるメリット</div>
          <ul class="box-list">
            <li>クエリごとの計算量が非常に軽い（O(1)）</li>
            <li>ビットの独立性が保たれる（計算ミスを防ぐ）</li>
            <li>Pythonでの処理上限 $10^7$ を余裕でクリア</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
