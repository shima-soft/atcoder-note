<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC470 C - A and B 解説</title>
  <link rel="stylesheet" href="../../specs/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <style>
    pre code.hljs { background: transparent !important; padding: 0 !important; }
  </style>
</head>
<body>
  <div class="slide surface">
    <div class="slide-header">
      <span class="label" style="background:var(--g-orange);color:#fff">アルゴリズム解説 (1)</span>
      <h2 class="slide-title">ビットの独立性を捉える</h2>
      <div class="hitokoto" style="border-color:var(--orange)">
        <span class="badge" style="background:var(--orange)">一言で</span>
        <p>2進数の各桁は、お互いに干渉せずに操作できる</p>
      </div>
    </div>
    <div class="pattern-cols slide-body">
      <div class="diagram-box">
        <svg width="600" height="400" viewBox="0 0 600 400">
          <!-- 背景・枠 -->
          <rect x="50" y="100" width="500" height="200" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="2" />
          <text x="300" y="80" text-anchor="middle" font-weight="bold">2進数での表現（例: 3）</text>
          
          <!-- 4ビットの箱 -->
          <g id="bits">
            <rect x="100" y="150" width="80" height="80" rx="5" fill="var(--muted)" stroke="var(--border)" stroke-width="2" />
            <text x="140" y="195" text-anchor="middle" font-size="20">0</text>
            
            <rect x="200" y="150" width="80" height="80" rx="5" fill="var(--muted)" stroke="var(--border)" stroke-width="2" />
            <text x="240" y="195" text-anchor="middle" font-size="20">0</text>
            
            <rect x="300" y="150" width="80" height="80" rx="5" fill="var(--orange)" stroke="var(--orange)" stroke-width="3" />
            <text x="340" y="195" text-anchor="middle" font-size="20" font-weight="bold">1</text>
            
            <rect x="400" y="150" width="80" height="80" rx="5" fill="var(--muted)" stroke="var(--border)" stroke-width="2" />
            <text x="440" y="195" text-anchor="middle" font-size="20">1</text>
          </g>

          <!-- 操作の矢印 -->
          <path d="M 140 250 L 340 250" stroke="var(--orange)" stroke-width="4" fill="none" marker-end="url(#arrow)" />
          <text x="240" y="280" text-anchor="middle" font-size="14" fill="var(--orange)">ビット演算の操作</text>
          <text x="340" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--orange)">特定の桁だけ変化！</text>

          <defs>
            <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3.5" orient="auto">
              <path d="M0,0 L0,10 L10,5 Z" fill="var(--orange)" />
            </marker>
          </defs>
        </svg>
      </div>
      <div class="info-col">
        <div class="biz-example">
          <h4 style="margin:0">💡 ここがポイント</h4>
          <p>整数を「ひとまとめ」の数として扱うのではなく、**「ビットの集まり」**として捉えるのが鍵です。</p>
        </div>
        <div class="ok-box">
          <div class="box-title">✅ 得られるメリット</div>
          <ul class="box-list">
            <li>特定の桁だけを狙って操作できる</li>
            <li>各桁の状態を独立して保持できる</li>
            <li>複雑な計算を「ビットの操作」に置き換えられる</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
