      <div class="info-col">
        <div class="biz-example">
          <h4 style="margin:0 0 .3rem 0;font-size:.78rem">💡 例えるなら</h4>
          <p style="font-size:.82rem;line-height:1.55">倉庫（安全マス）<strong>全部から同時に</strong>トラックを出発させ、各地点に「最初に届いた便の所要時間」を書き込む作業。どの地点も<strong>最寄りの倉庫</strong>の値が必ず先に届く。</p>
        </div>
        <div class="ok-box">
          <div class="box-title" style="color:var(--green)">✅ なぜ正しいのか</div>
          <ul class="box-list">
            <li>BFSは近い場所から<strong>順番に</strong>訪れる</li>
            <li>だから各マスに最初に書き込まれた数＝最寄り安全マスまでの距離</li>
          </ul>
        </div>
        <div class="ok-box">
          <div class="box-title" style="color:var(--green)">✅ 実装もシンプル</div>
          <ul class="box-list">
            <li>普通のBFSとの違いは初期化だけ</li>
            <li>「距離0のマスをキューに全部入れてから始める」。道具はキュー1本</li>
          </ul>
        </div>
