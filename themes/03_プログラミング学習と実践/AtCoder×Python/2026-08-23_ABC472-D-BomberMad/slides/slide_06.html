<!DOCTYPE html>

          <rect x="418" y="72" width="188" height="240" rx="12" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
          <text x="512" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--text)">答え（K=1）</text>
          <rect x="434" y="116" width="52" height="52" rx="6" fill="#3a3f55"/>
          <text x="460" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">#</text>

          <rect x="418" y="330" width="188" height="44" rx="22" fill="var(--green)"/>

          <text x="20" y="358" text-anchor="start" font-size="13.5" fill="var(--muted)">K=2 なら、距離2のマスまで数える</text>

          <!-- 凡例 -->
          <rect x="150" y="384" width="14" height="14" rx="4" fill="var(--green)"/>
          <text x="172" y="396" text-anchor="start" font-size="14" fill="var(--text)">距離0（安全）</text>
          <rect x="306" y="384" width="14" height="14" rx="4" fill="#f2a06a"/>
          <text x="328" y="396" text-anchor="start" font-size="14" fill="var(--text)">距離1</text>
          <rect x="406" y="384" width="14" height="14" rx="4" fill="#3a3f55"/>
          <text x="428" y="396" text-anchor="start" font-size="14" fill="var(--text)">爆弾</text>
        </svg>
      </div>
      <div class="info-col">
        <div class="biz-example">
          <h4 style="margin:0 0 .35rem 0;font-size:.78rem">💡 手順まとめ</h4>
          <div class="biz-step"><span class="snum" style="background:var(--g-orange)">1</span><p>安全な空マスに「0」と書く</p></div>
          <div class="biz-step"><span class="snum" style="background:var(--g-orange)">2</span><p>隣の空マスへ「＋1」と書いていく</p></div>
          <div class="biz-step" style="margin-bottom:0"><span class="snum" style="background:var(--g-orange)">3</span><p>距離が K 以下の空マスを数える</p></div>
        </div>
        <div class="ok-box">
          <div class="box-title" style="color:var(--green)">✅ サンプル1の答え</div>
          <ul class="box-list">
            <li>安全マスは (2,2) のみ</li>
            <li>距離1以内：(1,2)(2,1)(2,2)(2,3)(3,2) の<strong>5個</strong> ✓</li>
          </ul>
        </div>
        <div class="ng-box">
          <div class="box-title" style="color:var(--red)">⚠️ 移動ルールに注意</div>
          <ul class="box-list">
            <li>爆弾マスは<strong>通れない</strong>。書き込むのは空マスだけ</li>
          </ul>
        </div>
