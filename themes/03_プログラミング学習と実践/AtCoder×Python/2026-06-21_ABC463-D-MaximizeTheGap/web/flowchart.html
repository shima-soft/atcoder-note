<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABC463 D 思考フローチャート</title><style>:root{--bg:#f9fafb;--card:#fff;--border:#dde2ec;--text:#1a1d2e;--muted:#5e6a8a;--orange:#d96018;--green:#008f6a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:sans-serif;color:var(--text);line-height:1.7}.wrap{max-width:720px;margin:3rem auto;padding:1rem}h1{font-size:1.8rem}.q,.result{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin:.8rem 0}.q strong{display:block;margin-bottom:.5rem}button,a{display:inline-block;margin:.2rem;padding:.45rem .8rem;border:1px solid var(--orange);border-radius:8px;background:#fff;color:var(--orange);font-weight:700;text-decoration:none;cursor:pointer}.result{display:none;border-left:5px solid var(--green)}.muted{color:var(--muted)}</style></head><body><div class="wrap"><p><a href="index.html">← 解説へ戻る</a></p><h1>この問題で二分探索を思いつくまで</h1><p class="muted">3つの問いに順に答えて、思考ルートを確認します。</p><div class="q" id="q1"><strong>Q1. 最大スコアを直接列挙できる？</strong><button onclick="next(1)">N=20万なので無理</button></div><div class="q" id="q2" style="display:none"><strong>Q2. 距離xを固定したら、可能か判定できる？</strong><button onclick="next(2)">右端順の貪欲法でできる</button></div><div class="q" id="q3" style="display:none"><strong>Q3. xが増えると判定結果はどうなる？</strong><button onclick="next(3)">OKからNGへ一度だけ変わる</button></div><div class="result" id="result"><h2>答えの二分探索！</h2><p>固定したxを区間スケジューリングで判定し、最大のOKを探します。</p></div></div><script>function next(n){if(n<3)document.getElementById('q'+(n+1)).style.display='block';else document.getElementById('result').style.display='block'}</script></body></html>
