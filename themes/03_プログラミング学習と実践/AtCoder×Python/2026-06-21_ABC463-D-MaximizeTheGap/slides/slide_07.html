<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css"></head><body><div class="slide"><div class="slide-header"><span class="label" style="background:var(--g-orange);color:#fff">答えの二分探索</span><h2 class="slide-title">ok と ng の間を半分ずつ捨てる</h2><div class="hitokoto"><span class="badge" style="background:var(--blue)">SEARCH</span><p>10億通りでも、判定は約30回</p></div></div><div class="pattern-cols slide-body"><div class="diagram-box"><svg viewBox="0 0 620 430" width="100%" height="100%" role="img" aria-label="二分探索の更新"><text x="310" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1d2e">探索区間 [ok, ng)</text><rect x="60" y="70" width="500" height="44" rx="9" fill="#eaf8f3"/><rect x="310" y="70" width="250" height="44" rx="9" fill="#fff1f2"/><text x="175" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#008f6a">可能な側</text><text x="438" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#c9162e">不可能な側</text><path d="M310 60 L310 130" stroke="#d96018" stroke-width="4"/><text x="310" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#d96018">mid を判定</text><g font-size="15"><rect x="85" y="190" width="450" height="52" rx="10" fill="#fff" stroke="#dde2ec"/><text x="110" y="222" fill="#008f6a" font-weight="700">OK</text><text x="185" y="222" fill="#1a1d2e">なら</text><text x="245" y="222" fill="#d96018" font-weight="900">ok = mid</text><text x="355" y="222" fill="#5e6a8a">右半分を残す</text><rect x="85" y="260" width="450" height="52" rx="10" fill="#fff" stroke="#dde2ec"/><text x="110" y="292" fill="#c9162e" font-weight="700">NG</text><text x="185" y="292" fill="#1a1d2e">なら</text><text x="245" y="292" fill="#d96018" font-weight="900">ng = mid</text><text x="355" y="292" fill="#5e6a8a">左半分を残す</text></g><rect x="155" y="345" width="310" height="58" rx="12" fill="#fff7ed" stroke="#d96018" stroke-width="2"/><text x="310" y="380" text-anchor="middle" font-size="17" font-weight="900" fill="#d96018">ng − ok = 1 で終了</text></svg></div><div class="info-col"><div class="biz-example"><div class="biz-title">境界値の置き方</div><div class="biz-step"><span class="snum" style="background:var(--green)">ok</span><p>0（番兵。答えが存在しない場合も受け止める）</p></div><div class="biz-step"><span class="snum" style="background:var(--red)">ng</span><p>10<sup>9</sup> + 1（絶対に不可能）</p></div><div class="biz-step"><span class="snum" style="background:var(--orange)">mid</span><p>(ok + ng) // 2</p></div></div><div class="ng-box"><div class="box-title">境界の落とし穴</div><ul class="box-list"><li>閉区間は端点を共有しても重なる</li><li>ok=0 のままなら1以上の距離でK枚選べず、答えは -1</li></ul></div><div class="ok-box"><div class="box-title">探索回数</div><ul class="box-list"><li>2<sup>30</sup> ≒ 10<sup>9</sup> なので約30回</li></ul></div></div></div></div></body></html>
