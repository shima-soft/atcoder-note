<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css"></head><body><div class="slide"><div class="slide-header"><span class="label" style="background:var(--g-orange);color:#fff">失敗アプローチ</span><h2 class="slide-title">K枚の選び方を全部試す？</h2><div class="hitokoto"><span class="badge" style="background:var(--red)">TLE</span><p>20万枚から組合せを列挙するのは、入口で詰みます</p></div></div><div class="pattern-cols slide-body"><div class="diagram-box"><svg viewBox="0 0 620 430" width="100%" height="100%" role="img" aria-label="組合せ爆発の図"><text x="310" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1d2e">N枚からK枚を選ぶ枝分かれ</text><rect x="242" y="58" width="136" height="48" rx="10" fill="#fff" stroke="#d96018" stroke-width="3"/><text x="310" y="89" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d2e">最初の1枚</text><path d="M310 106 L120 160 M310 106 L250 160 M310 106 L380 160 M310 106 L500 160" stroke="#aab2c5" stroke-width="3"/><g fill="#fff" stroke="#dde2ec" stroke-width="2"><rect x="60" y="160" width="120" height="45" rx="9"/><rect x="190" y="160" width="120" height="45" rx="9"/><rect x="320" y="160" width="120" height="45" rx="9"/><rect x="450" y="160" width="120" height="45" rx="9"/></g><g font-size="15" text-anchor="middle" fill="#1a1d2e"><text x="120" y="188">布1</text><text x="250" y="188">布2</text><text x="380" y="188">布3</text><text x="510" y="188">…布N</text></g><path d="M120 205 L75 260 M120 205 L160 260 M250 205 L215 260 M250 205 L290 260 M380 205 L345 260 M380 205 L420 260 M510 205 L480 260 M510 205 L550 260" stroke="#c9162e" stroke-width="2"/><text x="310" y="305" text-anchor="middle" font-size="28" font-weight="900" fill="#c9162e">枝が爆発</text><rect x="105" y="330" width="410" height="62" rx="12" fill="#fff2f3" stroke="#c9162e" stroke-width="2"/><text x="310" y="357" text-anchor="middle" font-size="16" font-weight="700" fill="#c9162e">N = 200,000</text><text x="310" y="381" text-anchor="middle" font-size="15" fill="#5e6a8a">候補数は天文学的。全探索は不可能</text></svg></div><div class="info-col"><div class="ng-box"><div class="box-title">やってしまいがち</div><ul class="box-list"><li>K枚の全組合せを作る</li><li>各組合せで全ペアの距離を測る</li></ul></div><div class="biz-example"><div class="biz-title">発想を反転する</div><div class="biz-step"><span class="snum" style="background:var(--orange)">1</span><p>最大スコアそのものは分からない</p></div><div class="biz-step"><span class="snum" style="background:var(--blue)">2</span><p>でも「距離 x 以上で選べる？」なら判定できそう</p></div><div class="biz-step"><span class="snum" style="background:var(--green)">3</span><p>判定を使って最大の x を絞り込む</p></div></div><div class="note-box"><div class="box-title">仕事でたとえると</div><ul class="box-list"><li>最高予算を一発で決めず、「この予算で実現可能？」を段階的に確認する見積もり</li></ul></div></div></div></div></body></html>
