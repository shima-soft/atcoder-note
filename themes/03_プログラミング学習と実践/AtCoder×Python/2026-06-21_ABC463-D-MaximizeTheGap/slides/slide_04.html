<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css"></head><body><div class="slide surface"><div class="slide-header"><span class="label" style="background:var(--g-orange);color:#fff">判定問題へ変換</span><h2 class="slide-title">「スコア x 以上でK枚選べるか？」</h2><div class="hitokoto"><span class="badge" style="background:var(--green)">KEY</span><p>x が大きくなるほど条件は厳しくなる — OK / NG が一直線に並ぶ</p></div></div><div class="pattern-cols slide-body"><div class="diagram-box"><svg viewBox="0 0 620 420" width="100%" height="100%" role="img" aria-label="判定結果の単調性"><text x="310" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1d2e">サンプル1で距離 x を試す</text><line x1="70" y1="165" x2="550" y2="165" stroke="#aab2c5" stroke-width="5"/><g font-size="14" text-anchor="middle" font-weight="700"><circle cx="120" cy="165" r="29" fill="#008f6a"/><text x="120" y="171" fill="#fff">x=1</text><circle cx="245" cy="165" r="29" fill="#008f6a"/><text x="245" y="171" fill="#fff">x=2</text><circle cx="370" cy="165" r="29" fill="#c9162e"/><text x="370" y="171" fill="#fff">x=3</text><circle cx="495" cy="165" r="29" fill="#c9162e"/><text x="495" y="171" fill="#fff">x=4</text></g><text x="182" y="225" text-anchor="middle" font-size="18" font-weight="900" fill="#008f6a">3枚選べる</text><text x="432" y="225" text-anchor="middle" font-size="18" font-weight="900" fill="#c9162e">3枚は無理</text><path d="M307 110 L307 265" stroke="#d96018" stroke-width="4" stroke-dasharray="8 7"/><rect x="170" y="285" width="280" height="76" rx="12" fill="#fff" stroke="#d96018" stroke-width="2"/><text x="310" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d2e">境界の左端が最大スコア</text><text x="310" y="344" text-anchor="middle" font-size="23" font-weight="900" fill="#d96018">答え = 2</text></svg></div><div class="info-col"><div class="biz-example"><div class="biz-title">隣の布だけ見ればよい</div><div class="biz-step"><span class="snum" style="background:var(--orange)">1</span><p>選んだ布を左から並べる</p></div><div class="biz-step"><span class="snum" style="background:var(--orange)">2</span><p>最小距離は必ず隣り合う2枚のどこか</p></div><div class="biz-step"><span class="snum" style="background:var(--green)">3</span><p>次の左端 − 前の右端 ≥ x を守る</p></div></div><div class="ok-box"><div class="box-title">単調性</div><ul class="box-list"><li>x で可能なら、x より小さい距離も可能</li><li>x で不可能なら、x より大きい距離も不可能</li></ul></div><div class="note-box"><div class="box-title">だから二分探索</div><ul class="box-list"><li>0〜10億を約30回の判定で絞れる</li></ul></div></div></div></div></body></html>
