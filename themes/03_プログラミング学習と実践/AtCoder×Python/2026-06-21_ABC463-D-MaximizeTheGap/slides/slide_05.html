<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css"></head><body><div class="slide"><div class="slide-header"><span class="label" style="background:var(--g-orange);color:#fff">区間スケジューリング</span><h2 class="slide-title">右端が早い布から選ぶ</h2><div class="hitokoto"><span class="badge" style="background:var(--orange)">GREEDY</span><p>次の布にできるだけ広い空きを残す選択が、最大枚数につながる</p></div></div><div class="pattern-cols slide-body"><div class="diagram-box"><svg viewBox="0 0 620 430" width="100%" height="100%" role="img" aria-label="右端が早い区間を選ぶ貪欲法"><text x="310" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1d2e">同じ場所から選べる2枚</text><line x1="55" y1="145" x2="565" y2="145" stroke="#aab2c5" stroke-width="3"/><rect x="100" y="77" width="320" height="38" rx="8" fill="#fff1f2" stroke="#c9162e" stroke-width="2"/><text x="260" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#c9162e">長い布：右端が420</text><rect x="100" y="160" width="175" height="38" rx="8" fill="#eaf8f3" stroke="#008f6a" stroke-width="3"/><text x="187.5" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#008f6a">短い布：右端が275</text><path d="M275 215 L275 285" stroke="#008f6a" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#008f6a"/></marker></defs><rect x="82" y="300" width="456" height="82" rx="12" fill="#fff" stroke="#008f6a" stroke-width="2"/><text x="310" y="330" text-anchor="middle" font-size="17" font-weight="900" fill="#008f6a">早く終わる布を選ぶ</text><text x="310" y="357" text-anchor="middle" font-size="15" fill="#5e6a8a">右側の候補を減らさない、いちばん安全な選択</text></svg></div><div class="info-col"><div class="biz-example"><div class="biz-title">固定した距離 x の判定手順</div><div class="biz-step"><span class="snum" style="background:var(--orange)">1</span><p>布を右端 R の昇順にソート</p></div><div class="biz-step"><span class="snum" style="background:var(--orange)">2</span><p>選択済みの最後の右端を記録</p></div><div class="biz-step"><span class="snum" style="background:var(--green)">3</span><p>L − last_right ≥ x なら選ぶ</p></div><div class="biz-step"><span class="snum" style="background:var(--green)">4</span><p>K枚以上なら「x は可能」</p></div></div><div class="ok-box"><div class="box-title">なぜ最適？</div><ul class="box-list"><li>右端が早いほど、次の布を置ける範囲が広い</li><li>遅い布に交換して得することはない</li></ul></div><div class="note-box"><div class="box-title">会議室予約と同じ</div><ul class="box-list"><li>終了時刻が早い会議から採用すると、後の予約を多く入れられる</li></ul></div></div></div></div></body></html>
