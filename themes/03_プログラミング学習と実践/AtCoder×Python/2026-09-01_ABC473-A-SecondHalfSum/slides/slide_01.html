<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../specs/common.css">
<style>
.title-slide {
  width: 1280px; height: 720px;
  display: flex; flex-direction: row;
  overflow: hidden;
}
.panel-dark {
  width: 38%;
  background: #1a1d2e;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 2.2rem 2.2rem;
  position: relative;
  overflow: hidden;
}
.panel-dark::before {
  content: '';
  position: absolute; top: -100px; left: -80px;
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(217,96,24,.25) 0%, transparent 65%);
  pointer-events: none;
}
.panel-dark::after {
  content: '';
  position: absolute; bottom: -60px; right: -60px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(26,150,192,.15) 0%, transparent 65%);
  pointer-events: none;
}
.ep-badge {
  display: inline-block;
  background: var(--g-orange);
  color: #fff;
  font-size: .68rem;
  font-weight: 700;
  padding: .18rem .7rem;
  border-radius: 99px;
  letter-spacing: .1em;
  margin-bottom: .9rem;
  width: fit-content;
}
.main-title {
  font-size: 1.5rem;
  font-weight: 900;
  color: #fff;
  line-height: 1.25;
  margin-bottom: .5rem;
}
.main-title .prob-name {
  font-size: 2.2rem;
  font-weight: 900;
  color: var(--orange);
  display: block;
  line-height: 1.2;
  margin-top: .25rem;
}
.main-sub {
  font-size: .84rem;
  color: rgba(255,255,255,.55);
  margin-bottom: 1.4rem;
}
.algo-badge {
  display: flex;
  align-items: center;
  gap: .4rem;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px;
  padding: .28rem .6rem;
  width: fit-content;
  margin-top: .3rem;
}
.algo-badge .big-text {
  font-size: .82rem;
  font-weight: 600;
  color: rgba(255,255,255,.5);
  line-height: 1;
}
.algo-badge .algo-label {
  font-size: .65rem;
  color: rgba(255,255,255,.35);
  line-height: 1.4;
}
.panel-light {
  flex: 1;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  padding: 2.2rem 2.8rem 1.8rem;
}
.point-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.bottom-info {
  display: flex;
  flex-direction: column;
  gap: .3rem;
}
.source-badge {
  display: inline-block;
  background: rgba(217,96,24,.1);
  color: var(--orange);
  font-size: .68rem;
  font-weight: 700;
  padding: .18rem .7rem;
  border-radius: 99px;
  margin-bottom: .5rem;
  width: fit-content;
}
.diff-badge {
  display: inline-block;
  background: rgba(94,106,138,.12);
  color: var(--muted);
  font-size: .72rem;
  font-weight: 700;
  padding: .18rem .7rem;
  border-radius: 99px;
  width: fit-content;
  border: 1px solid rgba(94,106,138,.25);
}
.right-heading {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 1rem;
}
.point-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: .65rem;
  margin-bottom: 0;
}
.point-list li {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  font-size: .88rem;
  color: var(--text);
  line-height: 1.55;
}
.pnum {
  min-width: 22px; height: 22px;
  background: var(--g-orange);
  color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; font-weight: 700;
  flex-shrink: 0; margin-top: .05rem;
}
.credit {
  font-size: .68rem;
  color: var(--muted);
  opacity: .7;
  margin-top: 0;
}
.credit a { color: inherit; text-decoration: none; }
.credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="title-slide">
  <div class="panel-dark">
    <span class="ep-badge">AtCoder×Pythonシリーズ</span>
    <div class="main-title">
      ABC473 A問題
      <span class="prob-name">Second Half Sum</span>
    </div>
    <div class="main-sub">数列の「後ろ半分」だけを足す</div>
    <div class="algo-badge">
      <span class="big-text">半分に分けて合計</span>
      <span class="algo-label">for ループで足すだけ</span>
    </div>
  </div>
  <div class="panel-light">
    <div class="point-section">
      <span class="source-badge">📖 AtCoder ABC473 解説</span>
      <div class="right-heading">Today's Points</div>
      <ul class="point-list">
        <li>
          <span class="pnum">1</span>
          「数列をちょうど半分に分ける」という考え方が身につく
        </li>
        <li>
          <span class="pnum">2</span>
          問題文の「◯番目」と Python の添字のズレを、迷わず直せるようになる
        </li>
        <li>
          <span class="pnum">3</span>
          Python 9行のシンプルなループで正解を導ける
        </li>
      </ul>
    </div>
    <div class="bottom-info">
      <span class="diff-badge">ABC-A 難易度: 灰色 ★☆☆</span>
      <p class="credit">出典: <a href="https://atcoder.jp/contests/abc473/tasks/abc473_a" target="_blank">atcoder.jp/contests/abc473/tasks/abc473_a</a></p>
    </div>
  </div>
</div>
</body>
</html>
