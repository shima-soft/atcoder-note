<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
.title-slide {
  width: 1280px; height: 720px;
  display: flex; flex-direction: row;
  overflow: hidden;
}
.panel-dark {
  width: 38%;
  background: #1a1d2e;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 2.2rem 2.4rem;
  position: relative;
  overflow: hidden;
}
.panel-dark::before {
  content: '';
  position: absolute; top: -100px; left: -80px;
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(217,96,24,.28) 0%, transparent 65%);
  pointer-events: none;
}
.panel-dark::after {
  content: '';
  position: absolute; bottom: -60px; right: -60px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(0,143,106,.15) 0%, transparent 65%);
  pointer-events: none;
}
.ep-badge {
  display: inline-block;
  background: var(--g-orange);
  color: #fff;
  font-size: .68rem;
  font-weight: 700;
  padding: .18rem .7rem;
  border-radius: 99px;
  letter-spacing: .08em;
  margin-bottom: .9rem;
  width: fit-content;
}
.main-title {
  font-size: 2.1rem;
  font-weight: 900;
  color: #fff;
  line-height: 1.25;
  margin-bottom: .5rem;
}
.main-sub {
  font-size: .84rem;
  color: rgba(255,255,255,.55);
  margin-bottom: 1.4rem;
}
.algo-badge {
  display: flex;
  align-items: center;
  gap: .6rem;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 12px;
  padding: .55rem .9rem;
  width: fit-content;
}
.algo-badge .big-text {
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--orange);
  line-height: 1;
  letter-spacing: -.02em;
}
.algo-badge .algo-label {
  font-size: .75rem;
  color: rgba(255,255,255,.65);
  line-height: 1.4;
}
.panel-light {
  flex: 1;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 2.2rem 2.4rem 1.8rem;
}
.source-badge {
  display: inline-block;
  background: rgba(217,96,24,.1);
  color: var(--orange);
  font-size: .68rem;
  font-weight: 700;
  padding: .18rem .7rem;
  border-radius: 99px;
  margin-bottom: .9rem;
  width: fit-content;
}
.right-heading {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--text);
  margin-bottom: .9rem;
}
.point-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: .6rem;
  margin-bottom: .8rem;
}
.point-list li {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  font-size: .88rem;
  color: var(--text);
  line-height: 1.55;
}
.pnum {
  min-width: 22px; height: 22px;
  background: var(--g-orange);
  color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; font-weight: 700;
  flex-shrink: 0; margin-top: .05rem;
}
.diff-badge {
  display: inline-block;
  background: #c57e26;
  color: #fff;
  border-radius: 99px;
  padding: .2rem .75rem;
  font-size: .72rem;
  font-weight: 700;
  margin-bottom: .5rem;
}
.credit {
  font-size: .68rem;
  color: var(--muted);
  opacity: .7;
}
</style>
</head>
<body>
<div class="title-slide">
  <div class="panel-dark">
    <span class="ep-badge">競技プログラミング解説</span>
    <div class="main-title">アイテム交換で<br>何が集まる？</div>
    <div class="main-sub">ABC454 — C 問題「Straw Millionaire」</div>
    <div class="algo-badge">
      <span class="big-text">BFS</span>
      <span class="algo-label">グラフ<br>到達可能性</span>
    </div>
  </div>
  <div class="panel-light">
    <span class="source-badge">📖 AtCoder 解説</span>
    <div class="right-heading">今回学べること</div>
    <ul class="point-list">
      <li>
        <span class="pnum">1</span>
        「条件付き交換」問題を<strong>有向グラフの到達可能性</strong>に変換する発想が身につく
      </li>
      <li>
        <span class="pnum">2</span>
        幅優先探索（BFS）でキューを使って効率よく探索する手順がわかる
      </li>
      <li>
        <span class="pnum">3</span>
        O(N+M) の計算量で最大30万件のデータを処理できる理由が理解できる
      </li>
    </ul>
    <span class="diff-badge">AtCoder ABC-C ★★☆（Diff: ~400）</span>
    <p class="credit">出典: atcoder.jp/contests/abc454/tasks/abc454_c</p>
  </div>
</div>
</body>
</html>
