<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
.bfs-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: .45rem;
}
.step-label {
  font-size: .72rem;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: .2rem;
  letter-spacing: .04em;
}
.step-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: .5rem .8rem;
  display: flex;
  align-items: flex-start;
  gap: .55rem;
}
.step-card.done {
  border-color: rgba(0,143,106,.3);
  background: rgba(0,143,106,.04);
}
.step-num {
  min-width: 22px; height: 22px;
  background: var(--g-orange);
  color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; font-weight: 700;
  flex-shrink: 0; margin-top: .05rem;
}
.step-body {}
.step-title {
  font-size: .8rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: .1rem;
}
.step-desc {
  font-size: .76rem;
  color: var(--muted);
  line-height: 1.5;
}
.step-desc strong { color: var(--text); font-weight: 700; }
.step-desc em { color: var(--orange); font-style: normal; font-weight: 700; }

.result-box {
  background: rgba(0,143,106,.08);
  border: 2px solid rgba(0,143,106,.3);
  border-radius: 12px;
  padding: .5rem .9rem;
  display: flex;
  align-items: center;
  gap: .8rem;
  margin-top: auto;
}
.result-num {
  font-size: 2rem;
  font-weight: 900;
  color: var(--green);
  line-height: 1;
}
.result-text {
  font-size: .82rem;
  color: var(--text);
  line-height: 1.5;
}
.result-text strong { color: var(--green); }
</style>
</head>
<body style="position: relative;">
<div class="slide">
  <div class="slide-header">
    <span class="label" style="background:var(--g-orange);color:#fff">BFS 手順</span>
    <h2 class="slide-title">幅優先探索（BFS）で辿る</h2>
    <div class="hitokoto" style="border-color:var(--orange)">
      <span class="badge" style="background:var(--orange)">手順</span>
      <p>キューを使って「近いノードから順番に」探索し、訪問済みを記録するだけ</p>
    </div>
  </div>
  <div class="slide-body">
    <div class="pattern-cols">
      <div class="diagram-box">
        <!--
          BFS step-by-step visualization for sample 1
          Graph: 1→2, 2→3, 3→4, 2→4, 5→2
          Step 0: queue=[1], visited={1}
          Step 1: pop 1, neighbors=[2] → add 2. queue=[2], visited={1,2}
          Step 2: pop 2, neighbors=[3,4] → add 3,4. queue=[3,4], visited={1,2,3,4}
          Step 3: pop 3, neighbors=[4] → already visited. queue=[4]
          Step 4: pop 4, no neighbors. done. count=4

          Layout: show 4 steps as horizontal strips
          Each strip: queue state + graph highlight

          Positions: same as slide_04 but scaled down
          Nodes at: 1=(80,58), 2=(200,58), 3=(330,28), 4=(330,88), 5=(80,118) r=18
        -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" class="">
          <defs class="">
            <marker id="ag2" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto" class="">
              <path d="M0,0 L0,6 L7,3 Z" fill="#008f6a" class=""></path>
            </marker>
            <marker id="ao2" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto" class="">
              <path d="M0,0 L0,6 L7,3 Z" fill="#d96018" class=""></path>
            </marker>
            <marker id="am2" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto" class="">
              <path d="M0,0 L0,6 L7,3 Z" fill="#5e6a8a" class=""></path>
            </marker>
          </defs>

          <!-- === STEP 0 === y-offset=0 -->
          <text x="8" y="16" font-size="11" font-weight="700" fill="#d96018" class="">STEP 0: 初期化</text>
          <!-- queue box -->
          <rect x="8" y="22" width="200" height="22" rx="5" fill="rgba(217,96,24,.08)" stroke="rgba(217,96,24,.3)" stroke-width="1" class=""></rect>
          <text x="12" y="37" font-size="10" fill="#d96018" font-weight="700" class="">キュー: [1]</text>
          <text x="120" y="37" font-size="10" fill="#5e6a8a" class="">訪問済: {1}</text>

          <!-- mini graph step 0 -->
          <line x1="250" y1="32" x2="284" y2="32" stroke="#5e6a8a" stroke-width="1.5" marker-end="url(#am2)" class=""></line>
          <line x1="311.8" y1="28.4" x2="340" y2="20" stroke="#5e6a8a" stroke-width="1.5" marker-end="url(#am2)" class=""></line>
          <line x1="311.9" y1="36.9" x2="337.1" y2="62.1" stroke="#5e6a8a" stroke-width="1.5" marker-end="url(#am2)" class=""></line>
          <line x1="356" y1="31" x2="356" y2="50.6" stroke="#5e6a8a" stroke-width="1.5" marker-end="url(#am2)" class=""></line>
          <circle cx="234" cy="32" r="14" fill="rgba(217,96,24,.2)" stroke="#d96018" stroke-width="2" class=""></circle>
          <text x="234" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#d96018" class="">1</text>
          <circle cx="298" cy="32" r="14" fill="none" stroke="#dde2ec" stroke-width="1.5" class=""></circle>
          <text x="298" y="36" text-anchor="middle" font-size="11" fill="#5e6a8a" class="">2</text>
          <circle cx="356" cy="16" r="14" fill="none" stroke="#dde2ec" stroke-width="1.5" class=""></circle>
          <text x="356" y="20" text-anchor="middle" font-size="11" fill="#5e6a8a" class="">3</text>
          <circle cx="355.7" cy="67.5" r="14" fill="none" stroke="#dde2ec" stroke-width="1.5" class=""></circle>
          <text x="355.7" y="71.5" text-anchor="middle" font-size="11" fill="#5e6a8a" class="">4</text>
          <circle cx="234" cy="68" r="14" fill="none" stroke="#dde2ec" stroke-width="1.5" stroke-dasharray="3,2" class=""></circle>
          <text x="234" y="72" text-anchor="middle" font-size="11" fill="#5e6a8a" class="">5</text>

          <!-- === divider === -->
          <line x1="0" y1="92" x2="560" y2="92" stroke="#dde2ec" stroke-width="1" class=""></line>

          <!-- === STEP 1 === y-offset=98 -->
          <text x="8" y="110" font-size="11" font-weight="700" fill="#d96018" class="">STEP 1: ノード1を取り出す → 隣接ノード2を追加</text>
          <rect x="8" y="116" width="200" height="22" rx="5" fill="rgba(0,143,106,.08)" stroke="rgba(0,143,106,.3)" stroke-width="1" class=""></rect>
          <text x="12" y="131" font-size="10" fill="#008f6a" font-weight="700" class="">キュー: [2]</text>
          <text x="90" y="131" font-size="10" fill="#5e6a8a" class="">訪問済: {1, 2}</text>

          <line x1="250" y1="129" x2="284" y2="129" stroke="#d96018" stroke-width="2" marker-end="url(#ao2)" class=""></line>
          <line x1="311.9" y1="126" x2="340" y2="117" stroke="#5e6a8a" stroke-width="1.5" marker-end="url(#am2)" class=""></line>
          <line x1="311.4" y1="133.4" x2="339.9" y2="161.9" stroke="#5e6a8a" stroke-width="1.5" marker-end="url(#am2)" class=""></line>
          <line x1="356" y1="127.5" x2="356" y2="145.5" stroke="#5e6a8a" stroke-width="1.5" marker-end="url(#am2)" class=""></line>
          <circle cx="234" cy="129" r="14" fill="rgba(0,143,106,.12)" stroke="#008f6a" stroke-width="2" class=""></circle>
          <text x="234" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="#008f6a" class="">1</text>
          <circle cx="298" cy="129" r="14" fill="rgba(217,96,24,.15)" stroke="#d96018" stroke-width="2" class=""></circle>
          <text x="298" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="#d96018" class="">2</text>
          <circle cx="356" cy="113" r="14" fill="none" stroke="#dde2ec" stroke-width="1.5" class=""></circle>
          <text x="356" y="117" text-anchor="middle" font-size="11" fill="#5e6a8a" class="">3</text>
          <circle cx="356" cy="164.5" r="14" fill="none" stroke="#dde2ec" stroke-width="1.5" class=""></circle>
          <text x="356" y="168.5" text-anchor="middle" font-size="11" fill="#5e6a8a" class="">4</text>
          <circle cx="234" cy="165" r="14" fill="none" stroke="#dde2ec" stroke-width="1.5" stroke-dasharray="3,2" class=""></circle>
          <text x="234" y="169" text-anchor="middle" font-size="11" fill="#5e6a8a" class="">5</text>

          <!-- === divider === -->
          <line x1="0" y1="188" x2="560" y2="188" stroke="#dde2ec" stroke-width="1" class=""></line>

          <!-- === STEP 2 === y-offset=194 -->
          <text x="8" y="206" font-size="11" font-weight="700" fill="#d96018" class="">STEP 2: ノード2を取り出す → 隣接ノード3・4を追加</text>
          <rect x="8" y="212" width="200" height="22" rx="5" fill="rgba(0,143,106,.08)" stroke="rgba(0,143,106,.3)" stroke-width="1" class=""></rect>
          <text x="12" y="227" font-size="10" fill="#008f6a" font-weight="700" class="">キュー: [3, 4]</text>
          <text x="110" y="227" font-size="10" fill="#5e6a8a" class="">訪問済: {1,2,3,4}</text>

          <line x1="250" y1="225" x2="284" y2="225" stroke="#008f6a" stroke-width="1.8" marker-end="url(#ag2)" class=""></line>
          <line x1="312.4" y1="222" x2="340" y2="213" stroke="#d96018" stroke-width="2" marker-end="url(#ao2)" class=""></line>
          <line x1="310.7" y1="228.7" x2="339.4" y2="257.4" stroke="#d96018" stroke-width="2" marker-end="url(#ao2)" class=""></line>
          <line x1="356" y1="224.3" x2="356" y2="242.3" stroke="#5e6a8a" stroke-width="1.5" marker-end="url(#am2)" class=""></line>
          <circle cx="234" cy="225" r="14" fill="rgba(0,143,106,.12)" stroke="#008f6a" stroke-width="2" class=""></circle>
          <text x="234" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#008f6a" class="">1</text>
          <circle cx="298" cy="225" r="14" fill="rgba(0,143,106,.12)" stroke="#008f6a" stroke-width="2" class=""></circle>
          <text x="298" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#008f6a" class="">2</text>
          <circle cx="356" cy="209" r="14" fill="rgba(217,96,24,.15)" stroke="#d96018" stroke-width="2" class=""></circle>
          <text x="356" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#d96018" class="">3</text>
          <circle cx="355.4" cy="260.5" r="14" fill="rgba(217,96,24,.15)" stroke="#d96018" stroke-width="2" class=""></circle>
          <text x="355.4" y="264.5" text-anchor="middle" font-size="11" font-weight="700" fill="#d96018" class="">4</text>
          <circle cx="234" cy="261" r="14" fill="none" stroke="#dde2ec" stroke-width="1.5" stroke-dasharray="3,2" class=""></circle>
          <text x="234" y="265" text-anchor="middle" font-size="11" fill="#5e6a8a" class="">5</text>

          <!-- === divider === -->
          <line x1="0" y1="284" x2="560" y2="284" stroke="#dde2ec" stroke-width="1" class=""></line>

          <!-- === STEP 3 === y-offset=290 -->
          <text x="8" y="302" font-size="11" font-weight="700" fill="#008f6a" class="">STEP 3: ノード3・4を処理 → 新しいノードなし。探索完了！</text>
          <rect x="8" y="308" width="200" height="22" rx="5" fill="rgba(0,143,106,.08)" stroke="rgba(0,143,106,.3)" stroke-width="1" class=""></rect>
          <text x="12" y="323" font-size="10" fill="#008f6a" font-weight="700" class="">キュー: []（空）</text>
          <text x="110" y="323" font-size="10" fill="#5e6a8a" class="">訪問済: {1,2,3,4}</text>

          <line x1="250" y1="321" x2="284" y2="321" stroke="#008f6a" stroke-width="1.8" marker-end="url(#ag2)" class=""></line>
          <line x1="311.9" y1="317" x2="340" y2="309" stroke="#008f6a" stroke-width="1.8" marker-end="url(#ag2)" class=""></line>
          <line x1="311.2" y1="325.2" x2="337.2" y2="351.2" stroke="#008f6a" stroke-width="1.8" marker-end="url(#ag2)" class=""></line>
          <line x1="356" y1="320" x2="356" y2="338" stroke="#008f6a" stroke-width="1.8" marker-end="url(#ag2)" class=""></line>
          <circle cx="234" cy="321" r="14" fill="rgba(0,143,106,.15)" stroke="#008f6a" stroke-width="2.2" class=""></circle>
          <text x="234" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#008f6a" class="">1</text>
          <circle cx="298" cy="321" r="14" fill="rgba(0,143,106,.15)" stroke="#008f6a" stroke-width="2.2" class=""></circle>
          <text x="298" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#008f6a" class="">2</text>
          <circle cx="356" cy="305" r="14" fill="rgba(0,143,106,.15)" stroke="#008f6a" stroke-width="2.2" class=""></circle>
          <text x="356" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#008f6a" class="">3</text>
          <circle cx="355.4" cy="356.5" r="14" fill="rgba(0,143,106,.15)" stroke="#008f6a" stroke-width="2.2" class=""></circle>
          <text x="355.4" y="360.5" text-anchor="middle" font-size="11" font-weight="700" fill="#008f6a" class="">4</text>
          <circle cx="234" cy="357" r="14" fill="none" stroke="#dde2ec" stroke-width="1.5" stroke-dasharray="3,2" class=""></circle>
          <text x="234" y="361" text-anchor="middle" font-size="11" fill="#5e6a8a" class="">5</text>

          <!-- Final answer -->
          <rect x="8" y="390" width="544" height="43.8" rx="10" fill="rgba(0,143,106,.1)" stroke="rgba(0,143,106,.35)" stroke-width="1.8" class=""></rect>
          <text x="280" y="407" text-anchor="middle" font-size="15" font-weight="900" fill="#008f6a" class="">訪問ノード数 = 4（ノード1・2・3・4）→ 答え: 4</text>
          <text x="280" y="424" text-anchor="middle" font-size="12" fill="#5e6a8a" class="">※ ノード5は到達不可なのでカウントしない</text>
        </svg>
      </div>
      <div class="bfs-right">
        <div class="step-label">BFS の3大ルール</div>
        <div class="step-card">
          <span class="step-num">1</span>
          <div class="step-body">
            <div class="step-title">キューに入れる</div>
            <div class="step-desc">まず<strong>ノード1</strong>をキューに追加し、訪問済みフラグを立てる</div>
          </div>
        </div>
        <div class="step-card">
          <span class="step-num">2</span>
          <div class="step-body">
            <div class="step-title">先頭を取り出す</div>
            <div class="step-desc">キューの先頭ノードを取り出し、その<strong>隣接ノード</strong>を調べる</div>
          </div>
        </div>
        <div class="step-card">
          <span class="step-num">3</span>
          <div class="step-body">
            <div class="step-title">未訪問なら追加</div>
            <div class="step-desc"><em>まだ訪問していない</em>隣接ノードをキューに追加してフラグを立てる</div>
          </div>
        </div>
        <div class="step-card">
          <span class="step-num">4</span>
          <div class="step-body">
            <div class="step-title">キューが空になったら完了</div>
            <div class="step-desc">到達可能なノードをすべて探索し終えた → <strong>訪問数を出力</strong></div>
          </div>
        </div>
        <div class="result-box">
          <span class="result-num">4</span>
          <span class="result-text">種類のアイテムが<br>手に入る（<strong>正解</strong>）</span>
        </div>
      </div>
    </div>
  </div>
</div>


</body></html>
