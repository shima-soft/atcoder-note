<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
.pattern-cols {
  display: flex;
  gap: 1.2rem;
  flex: 1;
  overflow: hidden;
}
.diagram-box {
  flex: 0 0 52%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  padding: .4rem;
}
.info-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  overflow: hidden;
}
.biz-example {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: .6rem .8rem;
}
.biz-example .biz-title {
  font-size: .72rem;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: .3rem;
}
.biz-step {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: .2rem;
}
.snum {
  min-width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .76rem;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.biz-step p {
  font-size: .82rem;
  color: var(--text);
}
.ok-box, .ng-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: .5rem .8rem;
}
.ok-box { border-left: 3px solid var(--green); }
.ng-box { border-left: 3px solid var(--red); }
.box-title {
  font-size: .8rem;
  font-weight: 700;
  margin-bottom: .2rem;
}
.box-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: .1rem;
}
.box-list li {
  font-size: .84rem;
  color: var(--text);
  padding-left: .7rem;
  position: relative;
}
.box-list li::before {
  content: '•';
  position: absolute;
  left: 0;
  color: var(--muted);
}
</style>
</head>
<body style="position: relative;">
<div class="slide surface">
  <div class="slide-header">
    <span class="label" style="background:var(--g-orange);color:#fff">KEY IDEA</span>
    <h2 class="slide-title">イベントに注目する発想</h2>
    <div class="hitokoto" style="border-color:var(--orange)">
      <span class="badge" style="background:var(--orange)">一言で</span>
      <p>色の変化を「イベント」として日付ごとにグループ化する</p>
    </div>
  </div>
  <div class="pattern-cols slide-body">
    <div class="diagram-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" class="">
        <!-- タイトル -->
        <text x="260" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d2e" class="">イベントソートの発想</text>
        <!-- 変換前 -->
        <rect x="30" y="45" width="220" height="100" rx="8" fill="rgba(201,22,46,.06)" stroke="#c9162e" stroke-width="1.5" class=""></rect>
        <text x="140" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#c9162e" class="">変換前（毎日全鳥チェック）</text>
        <text x="140" y="85" text-anchor="middle" font-size="11" fill="#1a1d2e" class="">1日目: 全N羽を調べる</text>
        <text x="140" y="105" text-anchor="middle" font-size="11" fill="#1a1d2e" class="">2日目: 全N羽を調べる</text>
        <text x="140" y="125" text-anchor="middle" font-size="11" fill="#1a1d2e" class="">... M日分 → O(N×M)</text>
        <!-- 矢印 -->
        <path d="M260,95 L280,95" stroke="#d96018" stroke-width="2" marker-end="url(#arr-o)" class=""></path>
        <defs>
          <marker id="arr-o" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto" class="">
            <path d="M0,0 L0,6 L7,3 Z" fill="#d96018" class=""></path>
          </marker>
        </defs>
        <!-- 変換後 -->
        <rect x="290" y="45" width="200" height="100" rx="8" fill="rgba(0,143,106,.06)" stroke="#008f6a" stroke-width="1.5" class=""></rect>
        <text x="390" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#008f6a" class="">変換後（イベントに注目）</text>
        <text x="390" y="85" text-anchor="middle" font-size="11" fill="#1a1d2e" class="">イベントを日付ごとに整理</text>
        <text x="390" y="105" text-anchor="middle" font-size="11" fill="#1a1d2e" class="">変化がある日だけ処理</text>
        <text x="390" y="125" text-anchor="middle" font-size="11" fill="#1a1d2e" class="">→ O(N+M)</text>
        <!-- 例 -->
        <rect x="30" y="160" width="460" height="100" rx="8" fill="rgba(217,96,24,.06)" stroke="#d96018" stroke-width="1.5" class=""></rect>
        <text x="260" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#d96018" class="">具体例（サンプル1）</text>
        <text x="50" y="200" font-size="11" fill="#1a1d2e" class="">鳥1: D=3で色1→色2</text>
        <text x="50" y="220" font-size="11" fill="#1a1d2e" class="">鳥2: D=6で色2→色5</text>
        <text x="280" y="200" font-size="11" fill="#1a1d2e" class="">鳥3: D=5で色5→色1</text>
        <text x="280" y="220" font-size="11" fill="#1a1d2e" class="">鳥4: D=3で色3→色5</text>
        <text x="50" y="245" font-size="11" fill="#5e6a8a" class="">→ 3日目: 鳥1と鳥4が変化、5日目: 鳥3が変化、6日目: 鳥2が変化</text>
      </svg>
    </div>
    <div class="info-col">
      <div class="biz-example">
        <div class="biz-title">🎯 変換のポイント</div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">1</span>
          <p>各鳥の変化は「D_i日目に色A_i→色B_i」というイベント</p>
        </div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">2</span>
          <p>イベントを日付ごとにグループ化（バケットソート的）</p>
        </div>
        <div class="biz-step">
          <span class="snum" style="background:var(--g-orange)">3</span>
          <p>イベント総数はN個なので、整理にO(N)</p>
        </div>
      </div>
      <div class="ok-box">
        <div class="box-title">✅ 計算量の改善</div>
        <ul class="box-list">
          <li>イベント整理: O(N)</li>
          <li>イベント処理: 合計O(N)</li>
          <li>日ループ: O(M)</li>
          <li>合計: O(N+M) ← 30万でも余裕</li>
        </ul>
      </div>
      <div class="ng-box">
        <div class="box-title">⚠️ 注意点</div>
        <ul class="box-list">
          <li>イベントは「いつ起きるか」でグループ化する</li>
          <li>「何が起きるか」の順番は気にしなくてOK</li>
        </ul>
      </div>
    </div>
  </div>
</div>


</body></html>
